name: Upload integration bundles
description: >-
  Pack and upload one runtime bundle per integration project (Client, Kernel, Clustering), so each
  integration shard downloads only its own project and runs without a restore.
inputs:
  prefix:
    description: Build artifact prefix shared by the producer and the integration consumers.
    required: true
runs:
  using: composite
  steps:
    - name: Pack integration bundles
      shell: bash
      run: node .github/scripts/pack-integration-bundles.mjs pack --out .integration-bundles
    - name: Upload Client integration bundle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-client
        path: .integration-bundles/integration-bundle-client.tar.zst
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
    - name: Upload Kernel integration bundle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-kernel
        path: .integration-bundles/integration-bundle-kernel.tar.zst
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
    - name: Upload Clustering integration bundle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-clustering
        path: .integration-bundles/integration-bundle-clustering.tar.zst
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
