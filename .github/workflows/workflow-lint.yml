name: Workflow Lint

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - .github/actionlint.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: Cratis/Workflows/.github/workflows/workflow-lint.yml@main
