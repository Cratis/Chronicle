name: Workflow Lint

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - .github/actionlint.yml
      - .github/scripts/nightly-build-health-policy.mjs
      - .github/scripts/nightly-build-health.mjs
      - .github/scripts/test-nightly-build-health.mjs
      - .github/quarantine.json
      - .github/scripts/last-green-watchdog.mjs
      - .github/scripts/test-last-green-watchdog.mjs
      - .github/scripts/failed-spec-record.mjs
      - .github/scripts/test-failed-spec-record.mjs
      - .github/scripts/quarantine.mjs
      - .github/scripts/test-quarantine.mjs
      - .github/scripts/run-tests-with-retry.sh
      - .github/scripts/assert-image-push-permissions.py
      - .github/scripts/test-assert-image-push-permissions.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: Cratis/Workflows/.github/workflows/workflow-lint.yml@main

  nightly-health-policy:
    name: Scheduled nightly health policy fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out policy fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test scheduled nightly health policy
        run: node --test .github/scripts/test-nightly-build-health.mjs .github/scripts/test-last-green-watchdog.mjs .github/scripts/test-failed-spec-record.mjs .github/scripts/test-quarantine.mjs
      - name: Reject expired quarantine entries
        run: node .github/scripts/quarantine.mjs lint
      - name: Install workflow parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test image-push permission assertion
        run: python3 -B .github/scripts/test-assert-image-push-permissions.py
      - name: Require package-write permission for image pushes
        run: python3 .github/scripts/assert-image-push-permissions.py
