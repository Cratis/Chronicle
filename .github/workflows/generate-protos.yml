name: Generate Proto Files

on:
  workflow_call:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  generate-protos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Contracts
        working-directory: ./Source/Kernel/Contracts
        run: dotnet build -c Release

      - name: Generate proto files
        run: |
          CONTRACTS_DLL="Source/Kernel/Contracts/bin/Release/net10.0/Cratis.Chronicle.Contracts.dll"
          dotnet run \
            --project Source/Tools/ProtoGenerator/ProtoGenerator.csproj -- \
            "$CONTRACTS_DLL" \
            Source/Kernel/Protobuf

      # DescriptorSetWriter checks protobuf-net's parser. Published clients use Google's
      # protoc too, which rejects some schemas that parser accepts (such as name collisions).
      # Keep its validation descriptor separate from the canonical chronicle.desc.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protoc tooling
        run: python -m pip install grpcio-tools==1.83.0

      - name: Validate generated proto files with protoc
        working-directory: ./Source/Kernel/Protobuf
        run: |
          set -euo pipefail
          test -s chronicle.desc
          python -m grpc_tools.protoc -I. --fatal_warnings --include_imports \
            --descriptor_set_out="$RUNNER_TEMP/protoc-validation.desc" \
            ./*.proto protobuf-net/bcl.proto
          test -s "$RUNNER_TEMP/protoc-validation.desc"

      - name: Upload proto files artifact
        uses: actions/upload-artifact@v4
        with:
          name: proto-files
          path: Source/Kernel/Protobuf/
          retention-days: 1
          if-no-files-found: error
