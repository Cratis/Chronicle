name: Generate Proto Files

on:
  workflow_call:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  generate-protos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Contracts
        working-directory: ./Source/Kernel/Contracts
        run: dotnet build -c Release

      - name: Generate proto files
        run: |
          CONTRACTS_DLL="Source/Kernel/Contracts/bin/Release/net10.0/Cratis.Chronicle.Contracts.dll"
          dotnet run \
            --project Source/Tools/ProtoGenerator/ProtoGenerator.csproj -- \
            "$CONTRACTS_DLL" \
            Source/Kernel/Protobuf

      # The generated schemas feed the Kotlin, TypeScript and Elixir client publishes, so an output that a real
      # protoc rejects must fail here - not in the client publish steps downstream. The generator once produced an
      # enum value colliding with a message name and only the pre-existing checked-in file kept publishes green.
      - name: Validate generated proto files with protoc
        working-directory: ./Source/Kernel/Protobuf
        run: |
          pip install grpcio-tools
          mkdir -p "$RUNNER_TEMP/protoc-out"
          python -m grpc_tools.protoc -I. --python_out="$RUNNER_TEMP/protoc-out" *.proto protobuf-net/bcl.proto

      - name: Upload proto files artifact
        uses: actions/upload-artifact@v4
        with:
          name: proto-files
          path: Source/Kernel/Protobuf/
          retention-days: 1
