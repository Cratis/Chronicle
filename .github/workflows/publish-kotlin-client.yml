name: Publish Kotlin Client

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
      protos-artifact:
        description: Name of the artifact containing proto files. Leave empty to generate them.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
        default: '0.0.0'

env:
  DOTNET_VERSION: "11.0.x"

jobs:
  publish-kotlin-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected a SemVer version such as 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        if: inputs.protos-artifact == ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download proto files
        if: inputs.protos-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.protos-artifact }}
          path: Source/Kernel/Protobuf/

      - name: Build Contracts
        if: inputs.protos-artifact == ''
        working-directory: ./Source/Kernel/Contracts
        run: dotnet build -c Release

      - name: Generate proto files
        if: inputs.protos-artifact == ''
        run: |
          CONTRACTS_DLL="Source/Kernel/Contracts/bin/Release/net11.0/Cratis.Chronicle.Contracts.dll"
          dotnet run \
            --project Source/Tools/ProtoGenerator/ProtoGenerator.csproj -- \
            "$CONTRACTS_DLL" \
            Source/Kernel/Protobuf

      - name: Copy proto files into Kotlin project
        run: |
          mkdir -p Source/Clients/Kotlin/src/main/proto
          cp -r Source/Kernel/Protobuf/* Source/Clients/Kotlin/src/main/proto/

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          problem-matcher: true
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Check whether the version already exists on Maven Central
        id: maven-version
        run: |
          status=$(curl --disable --silent --show-error --globoff --output /dev/null --write-out '%{http_code}' \
            --max-time 30 "https://repo1.maven.org/maven2/${MAVEN_GROUP//.//}/$MAVEN_ARTIFACT/$VERSION/$MAVEN_ARTIFACT-$VERSION.pom")
          case "$status" in
            200)
              echo "::notice::$MAVEN_GROUP:$MAVEN_ARTIFACT:$VERSION already exists on Maven Central; skipping publish."
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Maven Central version lookup for $MAVEN_GROUP:$MAVEN_ARTIFACT:$VERSION returned HTTP $status."
              exit 1
              ;;
          esac
        env:
          VERSION: ${{ inputs.version }}
          # Must match the coordinates in Source/Clients/Kotlin/build.gradle.kts
          MAVEN_GROUP: io.cratis
          MAVEN_ARTIFACT: chronicle-contracts

      - name: Publish to Maven Central
        if: steps.maven-version.outputs.exists == 'false'
        working-directory: ./Source/Clients/Kotlin
        run: gradle publishAndReleaseToMavenCentral --no-configuration-cache "-Pversion=$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
