name: Nightly Build Health

on:
  workflow_run:
    workflows: ['.NET Build & Integration']
    types: [completed]
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

# GitHub owns the cross-process lock: every writer uses this same group across all triggers.
concurrency:
  group: nightly-build-health
  cancel-in-progress: false
  queue: max

jobs:
  report:
    if: >-
      github.repository == 'Cratis/Chronicle' &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # workflow_run is privileged; never check out the triggering run's ref, code or artifacts.
      - name: Check out trusted default-branch reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile scheduled nightly incident
        run: node .github/scripts/nightly-build-health.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Last-green watchdog
        if: always()
        run: node .github/scripts/last-green-watchdog.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain allowlisted metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nightly-health-summary.json
            ${{ runner.temp }}/last-green-watchdog-summary.json
          retention-days: 30
          if-no-files-found: error
