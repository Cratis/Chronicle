name: .NET Build & Integration

concurrency:
  # A reusable call inherits the caller's github.workflow and github.ref. Its caller
  # must use a different group key (for example, PR number and label as well), or
  # cancel-in-progress can cancel the caller while it waits for this workflow.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET8_VERSION: "8.0.410"
  DOTNET9_VERSION: "9.0.x"
  DOTNET_VERSION: "10.0.x"
  CRATIS_CHRONICLE_LOCAL_IMAGE: "ghcr.io/cratis/chronicle:${{ github.sha }}"

on:
  workflow_call:
    inputs:
      integration_requested:
        description: "Run Docker integration for a labeled pull request"
        type: boolean
        required: false
        default: false
      all_providers:
        description: "Run every storage backend for a hot-core pull request"
        type: boolean
        required: false
        default: false
    outputs:
      all_providers:
        description: "Whether the integration matrix used all storage providers"
        value: ${{ jobs.integration.outputs.all-providers }}
  workflow_dispatch:
  # Nightly full-coverage run; ordinary pull-request events run only the build and specs.
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
    # This list is a committed contract. `.github/build-affecting-paths.txt` records every path that must
    # reach a build and a test run, and carries the evidence for each one; the "Assert the build-affecting
    # path contract" step below fails when a required path is not covered by any pattern here. Narrowing
    # this list therefore requires saying in the pull request what stops being covered - a narrowing to
    # `.cs`/`.csproj` is how a `Directory.Packages.props` bump once merged with no build at all.
    paths:
      - "Source/**"
      - "Integration/**"
      - "Benchmarks/**"
      - "Docker/**"
      - "Directory.Packages.props"
      - "Directory.Packages.NET8.props"
      - "Directory.Packages.NET9.props"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - ".globalconfig"
      - ".editorconfig"
      - "Chronicle.slnx"
      - "specs.runsettings"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/build-affecting-paths.txt"
      - ".github/legacy-contracts.json"

jobs:
  # Nightly runs skip every job when this workflow already succeeded on the same commit. Pull requests, pushes
  # and manual runs are never skipped (the action only skips the schedule event).
  already-ran:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Check for a prior successful run
        id: gate
        uses: Cratis/Workflows/.github/actions/skip-if-already-ran@main

  # First, before anything is built: a change that breaks the wire contract for clients already running against this
  # major cannot ship, so there is nothing to gain from building and testing it. See wire-compatibility.yml.
  wire-compatibility:
    needs: [already-ran]
    if: needs.already-ran.outputs.skip != 'true'
    uses: ./.github/workflows/wire-compatibility.yml

  # Alongside it, the silo-to-silo contract: a change that stops this build's silos from sharing a cluster with the
  # latest release's breaks every rolling upgrade. See grain-compatibility.yml.
  grain-compatibility:
    needs: [already-ran]
    if: needs.already-ran.outputs.skip != 'true'
    uses: ./.github/workflows/grain-compatibility.yml

  dotnet-build:
    needs: [already-ran, wire-compatibility, grain-compatibility]
    if: needs.already-ran.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      chronicle-image: ${{ steps.export-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Needs nothing but the checkout, so it runs first and costs a second. A hole in the `paths:` filter
      # above is invisible by construction - the run that would have caught the change never starts - so
      # the only place to catch it is a run that did start, comparing the filter against the contract.
      - name: Assert the build-affecting path contract
        run: |
          python3 .github/scripts/assert-build-affecting-paths.py
          python3 -B .github/scripts/test-assert-build-affecting-paths.py

      # Runs before anything is compiled because it needs nothing but the checkout, and because a spec
      # project missing from the solution is invisible to every later step: it is never built, never
      # invoked, and therefore writes no TRX for the zero-test guard to find.
      - name: Assert every spec project is in the solution
        run: python3 .github/scripts/assert-solution-membership.py

      - name: Spec executable runner contracts and forbid test-host dispatch
        run: node --test .github/scripts/test-mixed-spec-runners.mjs

      # The publish workflow's Docker verification logic is release-only, so this checkout-only spec run is
      # where a pull request proves the tag expansion, retry and failure behavior before any publication occurs.
      - name: Spec the published Docker tag verifier
        run: python3 .github/scripts/test-verify-published-docker-tags.py

      - name: Spec the build version derivation
        run: python3 .github/scripts/test-derive-build-version.py

      - name: Spec prerelease artifact handoff without caches
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/scripts/test-pr-artifact-handoff.py
          python3 .github/scripts/test-sparse-integration-workflows.py

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      # Shared org cache: pull requests restore only; the nightly build and default-branch runs save (Cratis/Workflows#164).
      - name: Cache NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main

      - name: Restore obj cache
        uses: actions/cache@v4
        with:
          path: ./**/obj
          # Key on the package manifests so a dependency version change never restores a stale obj
          # cache from a different package set. A loose restore-key previously reused a pre-bump obj
          # cache across a package bump, producing a skewed publish where an older Cratis.Arc.Core.dll
          # shipped alongside newer Arc assemblies that referenced types it no longer contained.
          key: dotnet-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-${{ github.sha }}
          restore-keys: |
            dotnet-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-

      - name: Login to GitHub Docker Registry
        if: github.event_name != 'pull_request' || inputs.integration_requested
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json

      - name: Stamp the build version
        run: python3 .github/scripts/derive-build-version.py >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release -p:DisableProxyGenerator=true -p:DisableDockerBuild=true

      - name: Assert the build carries the stamped version
        run: |
          set -euo pipefail
          for dll in Source/Kernel/Contracts/bin/Release/net10.0/Cratis.Chronicle.Contracts.dll Source/Kernel/Server/bin/Release/net10.0/Cratis.Chronicle.Server.dll; do
            grep -a -F -q -- "$CRATIS_CHRONICLE_BUILD_VERSION" "$dll" || { echo "::error::$dll does not carry $CRATIS_CHRONICLE_BUILD_VERSION"; exit 1; }
          done

      # The build above is net10.0 only. The client packages ship net8.0 and net9.0 as well, and that multi-target
      # happens only under IsPackaging - which until now nothing ran before publish. So an API newer than net8.0
      # passed every check on a pull request and failed while the release was being cut, with the merge already
      # done. This builds what publish packs, on the frameworks it packs them for. The SDKs are already installed
      # above for exactly this reason.
      - name: Build client packages for every shipped framework
        run: |
          set -e
          find ./Source/Clients -name "*.csproj" ! -name "*.Specs.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet build "$project" --configuration Release -p:IsPackaging=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true
          done
          dotnet build ./Source/Kernel/Contracts/Contracts.csproj --configuration Release -p:IsPackaging=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true

      # A package can build and still fail to restore for a consumer: a transitive dependency resolves below what
      # another package declares (NU1605) or outside an exact constraint (NU1608), which only shows up once the
      # packages are restored from a feed. Pack what publish packs from the build above, into a local feed that is
      # never pushed, and restore one isolated consumer per package with those warnings as errors.
      - name: Verify packed client packages restore for consumers
        env:
          PACKED_VERSION: 0.0.0-pr.${{ github.event.pull_request.number || github.run_number }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/packed"
          dotnet pack ./Source/Clients/Packages.slnf --no-build --configuration Release -p:IsPackaging=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true -p:PackageVersion="$PACKED_VERSION" -o "$feed"
          bash .github/scripts/verify-packed-consumer-restore.sh "$PACKED_VERSION" "$feed"

      # Ordinary PRs can check the local Dockerfile against the Release binaries built above.
      # No DEVELOPMENT-symbol build, registry login or image push is needed for this smoke check.
      - name: Verify local Docker image without push
        if: github.event_name == 'pull_request' && !inputs.integration_requested
        run: |
          set -euo pipefail
          mkdir -p Source/Kernel/Server/out
          cp -r Source/Kernel/Server/bin/Release/net10.0/. Source/Kernel/Server/out/
          docker build -t "chronicle-dockerfile-check:${{ github.sha }}" -f Docker/Local/Dockerfile .

      # Integration runs need an image to share with their shards. The existing push guard
      # checks the event actor (the person applying a label), not the PR author. A read-only
      # token can still prevent pushing even when the actor is not Dependabot.
      - name: Build development Docker image
        if: github.event_name != 'pull_request' || inputs.integration_requested
        run: |
          dotnet publish Source/Kernel/Server/Server.csproj \
            --configuration Debug \
            --no-restore \
            -o Source/Kernel/Server/out
          docker build -t "${{ env.CRATIS_CHRONICLE_LOCAL_IMAGE }}" -f Docker/Local/Dockerfile .

      - name: Push development Docker image
        if: (github.event_name != 'pull_request' || inputs.integration_requested) && github.actor != 'dependabot[bot]'
        run: docker push ${{ env.CRATIS_CHRONICLE_LOCAL_IMAGE }}

      - name: Pack Release build output
        run: |
          set -euo pipefail
          for project in Source/Kernel/Core.Specs Source/Kernel/Server Integration/MongoDB Integration/Api; do
            test -d "$project/bin/Release/net10.0" || { echo "Missing build output for $project" >&2; exit 1; }
          done
          find . -type d -name bin -not -path '*/node_modules/*' -prune -print0 | tar --null -I 'zstd -T0' -cf build-output-release.tar.zst -T -

      - name: Upload Release build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-release
          path: build-output-release.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Export image
        if: github.event_name != 'pull_request' || inputs.integration_requested
        id: export-image
        run: echo "image=${{ env.CRATIS_CHRONICLE_LOCAL_IMAGE }}" >> "$GITHUB_OUTPUT"

  # Only integration shards consume the DEVELOPMENT-symbol build. Ordinary PR pushes
  # keep the Release build and specs, without this extra build or artifact.
  dotnet-build-development:
    if: needs.already-ran.outputs.skip != 'true' && (github.event_name != 'pull_request')
    needs: [already-ran, wire-compatibility, grain-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      # Shared org cache: pull requests restore only; the nightly build and default-branch runs save (Cratis/Workflows#164).
      - name: Cache NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main

      - name: Restore obj cache
        uses: actions/cache@v4
        with:
          path: ./**/obj
          # Package-aware key (see the dotnet-build job) so a dependency bump busts the stale obj cache.
          key: dotnet-dev-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-${{ github.sha }}
          restore-keys: |
            dotnet-dev-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json

      - name: Stamp the build version
        run: python3 .github/scripts/derive-build-version.py >> "$GITHUB_ENV"

      - name: Build with DEVELOPMENT symbol
        run: dotnet build --configuration Release -p:EnableDevelopmentSymbol=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true

      - name: Pack DEVELOPMENT build output
        run: |
          set -euo pipefail
          for project in Integration/Client Integration/Kernel Integration/Clustering Integration/SqlClustering; do
            test -d "$project/bin/Release/net10.0" || { echo "Missing build output for $project" >&2; exit 1; }
          done
          find . -type d -name bin -not -path '*/node_modules/*' -prune -print0 | tar --null -I 'zstd -T0' -cf build-output-development.tar.zst -T -

      - name: Upload DEVELOPMENT build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-development
          path: build-output-development.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Requested PR path: builds in parallel with the specs, so integration does not wait for
  # specs and then for this build in sequence. The integration job still requires successful
  # specs before any shard runs; a red spec costs only this one build.
  dotnet-build-development-requested:
    if: needs.already-ran.outputs.skip != 'true' && (github.event_name == 'pull_request' && inputs.integration_requested)
    needs: [already-ran, wire-compatibility, grain-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      # Shared org cache: pull requests restore only; the nightly build and default-branch runs save (Cratis/Workflows#164).
      - name: Cache NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main

      - name: Restore obj cache
        uses: actions/cache@v4
        with:
          path: ./**/obj
          # Package-aware key (see the dotnet-build job) so a dependency bump busts the stale obj cache.
          key: dotnet-dev-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-${{ github.sha }}
          restore-keys: |
            dotnet-dev-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json

      - name: Stamp the build version
        run: python3 .github/scripts/derive-build-version.py >> "$GITHUB_ENV"

      - name: Build with DEVELOPMENT symbol
        run: dotnet build --configuration Release -p:EnableDevelopmentSymbol=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true

      - name: Pack DEVELOPMENT build output
        run: |
          set -euo pipefail
          for project in Integration/Client Integration/Kernel Integration/Clustering Integration/SqlClustering; do
            test -d "$project/bin/Release/net10.0" || { echo "Missing build output for $project" >&2; exit 1; }
          done
          find . -type d -name bin -not -path '*/node_modules/*' -prune -print0 | tar --null -I 'zstd -T0' -cf build-output-development.tar.zst -T -

      - name: Upload DEVELOPMENT build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-development
          path: build-output-development.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  specs-other:
    if: needs.already-ran.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [already-ran, dotnet-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Download Release build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-release

      - name: Extract Release build output
        run: tar -I zstd -xf build-output-release.tar.zst

      # Release artifacts contain bin, not obj. Restore current evaluated package inputs
      # before comparing all 31 test + 2 shipping selections with the built runtime graph.
      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json

      - name: Restore mixed runner evaluation inputs
        run: dotnet restore -p:DisableProxyGenerator=true -p:DisableDockerBuild=true

      # Keep Azure Key Vault with Vault in this Docker-capable specs job, including
      # before its solution-membership change lands. No rebuild once it is listed.
      - name: Build Azure Key Vault specs when absent from solution
        run: |
          set -euo pipefail
          listed=$(node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            import { validateSolutionProjects } from './.github/scripts/mixed-specs-selection.mjs';
            const projects = validateSolutionProjects(await readFile('Chronicle.slnx', 'utf8'));
            console.log(projects.includes('Source/Kernel/Storage.AzureKeyVault.Specs/Storage.AzureKeyVault.Specs.csproj'));
          ")
          if [ "$listed" = false ]; then
            dotnet build Source/Kernel/Storage.AzureKeyVault.Specs/Storage.AzureKeyVault.Specs.csproj --configuration Release -p:DisableProxyGenerator=true -p:DisableDockerBuild=true
          fi

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      # Mandatory real-collector proof on Linux before native-v3 coverage is accepted: exact
      # child exit 37 and external deadline 124 with no probe-owned orphans. Failure or an
      # incomplete run fails this gate; production hits still come only from the real specs.
      # The profiler attaches only to .NET; this non-.NET child's launcher equivalence
      # remains unproven until Linux CI runs this mandatory acceptance.
      - name: Verify real collector exit and deadline cleanup
        run: node .github/scripts/verify-mixed-specs-collector.mjs

      - name: Run tests with coverage
        # Integration and SQL retain their shard/retry selection. Ordinary dispatch excludes
        # &FullyQualifiedName!~Cratis.Chronicle.Storage.Sql. and applies specs.runsettings.
        # Each project gets fresh, unique TRX/Cobertura; empty/spec-only coverage fails.
        # Actual production hits come only from these real library specs.
        run: node .github/scripts/run-mixed-specs.mjs

      - name: Assert specs ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: The specs job

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-specs
          path: ./coverage-results/
          retention-days: 1

  specs-sql:
    if: needs.already-ran.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The sqlserver shard takes 21-27 minutes on hosted runners; 30 cancelled a passing run.
    timeout-minutes: 45
    needs: [already-ran, dotnet-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [postgresql, sqlserver, remaining]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Release build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-release

      - name: Extract Release build output
        run: tar -I zstd -xf build-output-release.tar.zst

      - name: Restore SQL runner evaluation inputs
        run: dotnet restore Source/Kernel/Storage.Sql.Specs/Storage.Sql.Specs.csproj

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      - name: Run SQL collection filter specs
        run: python3 .github/scripts/test-sql-spec-filter.py

      - name: Run SQL specs with coverage
        run: |
          set -euo pipefail
          filter=$(python3 .github/scripts/sql-spec-filter.py '${{ matrix.shard }}')
          node .github/scripts/run-spec-project.mjs --project Source/Kernel/Storage.Sql.Specs/Storage.Sql.Specs.csproj --settings specs.runsettings --filter "$filter" --coverage --results-directory ./coverage-results

      - name: Assert SQL specs ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: The SQL specs ${{ matrix.shard }} shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-specs-sql-${{ matrix.shard }}
          path: ./coverage-results/
          retention-days: 1

  legacy-contracts:
    # Report red upstream jobs instead of skipping the gate, but not for a cancelled run.
    if: ${{ needs.already-ran.outputs.skip != 'true' && (!cancelled()) }}
    needs: [already-ran, wire-compatibility, grain-compatibility, specs-other, specs-sql]
    permissions:
      contents: read
      issues: read
      actions: read
    uses: ./.github/workflows/legacy-contracts.yml
    with:
      jobs: ${{ toJSON(needs) }}

  # Preserve the required check and all existing integration/coverage dependencies.
  # A failed, skipped or cancelled shard must never turn this aggregate green.
  specs:
    if: ${{ needs.already-ran.outputs.skip != 'true' && (always()) }}
    needs: [already-ran, specs-other, specs-sql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every spec job to pass
        env:
          OTHER_RESULT: ${{ needs.specs-other.result }}
          SQL_RESULT: ${{ needs.specs-sql.result }}
        run: test "$OTHER_RESULT" = success && test "$SQL_RESULT" = success

  # Dependabot's read-only token cannot push the image these shards pull. A bump needing
  # the full matrix must be reopened as an ordinary PR, where the token can push.
  integration:
    # On a pull request the matrix fans out only after the ordinary specs passed in this same run
    # (#5050): a red spec must not spend the matrix. Nightly and manual runs keep integration
    # independent of specs, so a failing spec does not hide integration results there.
    # !cancelled() overrides implicit success(): the unused DEVELOPMENT sibling is skipped.
    if: ${{ needs.already-ran.outputs.skip != 'true' && (!cancelled() && needs.dotnet-build.result == 'success' && ((github.event_name != 'pull_request' && needs.dotnet-build-development.result == 'success') || (github.event_name == 'pull_request' && needs.dotnet-build-development-requested.result == 'success')) && (github.event_name != 'pull_request' || (inputs.integration_requested && needs.specs.result == 'success')) && github.actor != 'dependabot[bot]') }}
    needs: [already-ran, dotnet-build, dotnet-build-development, dotnet-build-development-requested, specs]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      # Integration shards download the DEVELOPMENT-symbol build and run --no-build;
      # the Docker image still comes from dotnet-build.
      build-output-artifact: build-output-development
      chronicle-image: ${{ needs.dotnet-build.outputs.chronicle-image }}
      # Every storage backend nightly and on dispatch; labeled hot-core PRs also use all providers.
      all-providers: ${{ github.event_name != 'pull_request' || inputs.all_providers }}

  integration-api:
    # Waits for the ordinary specs on pull requests, like the integration matrix (#5050).
    if: ${{ needs.already-ran.outputs.skip != 'true' && (!cancelled() && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || (inputs.integration_requested && needs.specs.result == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [already-ran, dotnet-build, specs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Download Release build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-release

      - name: Extract Release build output
        run: tar -I zstd -xf build-output-release.tar.zst

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image from downloaded binaries
        run: |
          rm -rf Source/Kernel/Server/out
          mkdir -p Source/Kernel/Server/out
          cp -r Source/Kernel/Server/bin/Release/net10.0/. Source/Kernel/Server/out/
          docker build -t "${{ env.CRATIS_CHRONICLE_LOCAL_IMAGE }}" -f Docker/Local/Dockerfile .

      - name: Restore API runner evaluation inputs
        run: dotnet restore Integration/Api/Api.csproj

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      - name: Run API integration tests with coverage
        run: node .github/scripts/run-spec-project.mjs --project Integration/Api/Api.csproj --coverage --results-directory ./Integration/Api/coverage-results

      - name: Assert API integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./Integration/Api/coverage-results
          name: The API integration job

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-integration-api
          path: ./Integration/Api/coverage-results/
          retention-days: 1

  mongodb:
    # Waits for the ordinary specs on pull requests, like the integration matrix (#5050).
    if: ${{ needs.already-ran.outputs.skip != 'true' && (!cancelled() && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || (inputs.integration_requested && needs.specs.result == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [already-ran, dotnet-build, specs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Download Release build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-release

      - name: Extract Release build output
        run: tar -I zstd -xf build-output-release.tar.zst

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore MongoDB runner evaluation inputs
        run: dotnet restore Integration/MongoDB/MongoDB.csproj

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      - name: Extract pinned released runtime for MongoDB binding proof
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Registry metadata pins the bytes; image-to-release-source provenance remains UNKNOWN.
          image='cratis/chronicle:19.106.2-development-slim@sha256:3dcf0cf274200619809573faa16395195364568a1162d9c210e815b5ba5a9643'
          runtime="$RUNNER_TEMP/chronicle-released-binding"
          test ! -e "$runtime"
          mkdir "$runtime"
          timeout --kill-after=10s 5m docker pull "$image"
          container="chronicle-released-binding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            trap - EXIT
            if ! timeout --kill-after=10s 30s docker rm "$container" >/dev/null; then
              echo '::error::Could not remove the stopped released-runtime extraction container'
              exit 1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          timeout --kill-after=10s 30s docker create --name "$container" "$image" >/dev/null
          timeout --kill-after=10s 2m docker cp "$container:/app/." "$runtime/"
          test -f "$runtime/Cratis.Chronicle.Core.dll"
          test -f "$runtime/Cratis.Chronicle.Server.dll"
          echo "CHRONICLE_RELEASED_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"

      - name: Prove MongoDB keys bind only through released direct storage options
        run: |
          timeout --kill-after=10s 120s node .github/scripts/run-spec-project.mjs --project Integration/MongoDB/MongoDB.csproj --filter 'FullyQualifiedName~for_ReleasedKernelConfiguration' --results-directory ./Integration/MongoDB/released-binding-results
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { nodes, parseXml } from './.github/scripts/mixed-specs-results.mjs';
          const root = parseXml(await readFile('./Integration/MongoDB/released-binding-results/results.trx', 'utf8'));
          const results = nodes(root, 'UnitTestResult');
          assert.equal(results.length, 8, 'All eight released binding facts must run');
          assert.ok(results.every(result => result.attrs.outcome === 'Passed'), 'Released binding facts must pass, never skip');
          const passed = new Set(results.map(result => result.attrs.testId));
          const methods = nodes(root, 'UnitTest').filter(test => passed.has(test.attrs.id))
            .map(test => nodes(test, 'TestMethod')[0].attrs);
          const classes = {
            when_binding_fixture_storage_keys: ['should_bind_the_fixture_provider', 'should_bind_the_fixture_connection'],
            when_binding_original_cluster_keys: ['should_not_bind_the_original_provider', 'should_not_bind_the_original_connection']
          };
          for (const [type, facts] of Object.entries(classes)) {
            const expected = [...facts, 'should_use_released_options_not_head', 'should_use_released_storage_not_head'];
            for (const name of expected) {
              assert.ok(methods.some(method => method.className === `Cratis.Chronicle.MongoDB.Integration.Observation.for_ReleasedKernelConfiguration.${type}` && method.name === name), `Missing released binding fact: ${type}.${name}`);
            }
          }
          NODE

      - name: Run MongoDB integration tests with coverage
        run: node .github/scripts/run-spec-project.mjs --project Integration/MongoDB/MongoDB.csproj --coverage --results-directory ./Integration/MongoDB/coverage-results

      - name: Assert MongoDB integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./Integration/MongoDB/coverage-results
          name: The MongoDB integration job

      - name: Require actual old MongoDB writer and payload preservation facts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { nodes, parseXml } from './.github/scripts/mixed-specs-results.mjs';
          const root = parseXml(await readFile('./Integration/MongoDB/coverage-results/results.trx', 'utf8'));
          const passed = new Set(nodes(root, 'UnitTestResult').filter(result => result.attrs.outcome === 'Passed').map(result => result.attrs.testId));
          const methods = nodes(root, 'UnitTest').filter(test => passed.has(test.attrs.id))
            .map(test => nodes(test, 'TestMethod')[0].attrs);
          for (const name of [
            'should_require_an_actual_old_writer_update',
            'should_preserve_the_legacy_identity',
            'should_preserve_legacy_subscription_mode',
            'should_preserve_the_last_handled_event',
            'should_preserve_the_next_event',
            'should_preserve_handled_count',
            'should_preserve_legacy_replay_sets',
            'should_preserve_legacy_partition_sets',
            'should_preserve_partition_claims_byte_for_byte',
            'should_preserve_the_wide_claim_byte_for_byte',
            'should_preserve_the_revision',
            'should_remain_readable_by_the_new_provider'
          ]) {
            assert.ok(methods.some(method => method.className === 'Cratis.Chronicle.MongoDB.Integration.Observation.for_ObserverPayloadRoundTrip.when_old_kernel_reads_and_writes_new_claims' && method.name === name), `Missing passing old MongoDB writer fact: ${name}`);
          }
          NODE

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-mongodb
          path: |
            ./Integration/MongoDB/coverage-results/
            ./Integration/MongoDB/released-binding-results/
          retention-days: 1

  coverage-merge-and-cache:
    # Override implicit success() so the unused DEVELOPMENT ancestor does not suppress coverage.
    # Require every immediate prerequisite: never cache incomplete results (including ordinary PRs).
    if: ${{ needs.already-ran.outputs.skip != 'true' && (!cancelled() && github.event_name != 'pull_request_target' && needs.specs.result == 'success' && needs.integration.result == 'success' && needs.integration-api.result == 'success' && needs.mongodb.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [already-ran, specs, integration, integration-api, mongodb]
    outputs:
      coverage-cache-key: ${{ steps.export-coverage-key.outputs.key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-coverage-results
          # Download all coverage artifacts using wildcard pattern
          pattern: coverage-results-*

      - name: Merge coverage results
        run: |
          # Create directories for merged coverage
          mkdir -p ./coverage-results
          mkdir -p ./coverage-reports
          
          # Find all coverage.cobertura.xml files from artifacts and copy them
          find ./all-coverage-results -name "coverage.cobertura.xml" -type f | while IFS= read -r file; do
            echo "Found coverage file: $file"
            # Create unique directory for each coverage file
            dirname_hash=$(echo "$file" | md5sum | cut -d' ' -f1)
            mkdir -p "./coverage-results/$dirname_hash"
            cp "$file" "./coverage-results/$dirname_hash/coverage.cobertura.xml"
          done
          
          echo "Merged coverage results:"
          find ./coverage-results -name "coverage.cobertura.xml" | head -20

      - name: Install coverage tools
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate merged coverage report
        run: |
          reportgenerator \
            -reports:"./coverage-results/**/coverage.cobertura.xml" \
            -targetdir:"./coverage-reports" \
            -reporttypes:"Cobertura;JsonSummary" \
            -assemblyfilters:"-*.Specs;-xunit*;-NSubstitute*"
          
          echo "Generated coverage report:"
          ls -la ./coverage-reports/

      - name: Cache merged coverage
        uses: actions/cache@v4
        with:
          path: ./coverage-reports
          key: coverage-cache-${{ github.sha }}

      - name: Export coverage cache key
        id: export-coverage-key
        run: |
          echo "key=coverage-cache-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Collect coverage statistics
        env:
          COVERAGE_REF_NAME: ${{ github.head_ref || github.ref_name }}
          COVERAGE_MESSAGE: ${{ github.event.head_commit.message || format('Coverage update for {0}', github.head_ref || github.ref_name) }}
        run: |
          .github/scripts/collect-coverage.sh \
            "./coverage-reports" \
            "./Documentation/statistics/coverage-data.js" \
            "$COVERAGE_REF_NAME" \
            "${{ github.sha }}" \
            "$COVERAGE_MESSAGE"

  # Running the benchmarks takes ~13 minutes and sits on the critical path behind dotnet-build, which made it
  # the single thing deciding how long a pull request takes to go green. It cannot fail a build either
  # (fail-on-alert is false), so the series is tracked on main by benchmarks.yml instead.
  #
  # What still has to hold per pull request is that the benchmark projects BUILD, or a broken one lands green
  # and breaks main. Building them the way BenchmarkDotNet does - it regenerates and rebuilds with
  # ArtifactsPath set, which changes which project references apply - is what catches that, and costs ~2
  # minutes off the critical path rather than ~13 on it.
  benchmarks-build:
    if: needs.already-ran.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [already-ran, dotnet-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Release build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-release

      - name: Extract Release build output
        run: tar -I zstd -xf build-output-release.tar.zst

      - name: Build benchmarks the way BenchmarkDotNet does
        run: |
          # CratisProxiesOutputPath= skips the Arc proxy generator the same way a Release
          # verification build does elsewhere (see general.md). It is required here, not just
          # conventional: BenchmarkDotNet's ArtifactsPath redirects OutputPath to an absolute
          # temp directory, and the generator's own path-combine logic assumes a
          # project-relative OutputPath - fed an absolute one it double-roots the assembly
          # path and crashes before benchmarks ever need a proxy.
          dotnet build Benchmarks/Chronicle.Benchmarks/Chronicle.Benchmarks.csproj \
            -c Release /p:TreatWarningsAsErrors=false /p:DisableDockerBuild=true \
            /p:CratisProxiesOutputPath= \
            /p:ArtifactsPath="${RUNNER_TEMP}/benchmark-artifacts"
          dotnet build Benchmarks/Chronicle.Benchmarks.Clustering/Chronicle.Benchmarks.Clustering.csproj \
            -c Release /p:TreatWarningsAsErrors=false /p:DisableDockerBuild=true \
            /p:CratisProxiesOutputPath= \
            /p:ArtifactsPath="${RUNNER_TEMP}/benchmark-artifacts-clustering"
