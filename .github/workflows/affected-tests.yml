name: Affected tests (pilot)

# Pilot of Cratis/Workflows#268, beside the existing .NET Build & Integration and not required by it.
# It covers the ordinary spec projects; the Docker backed integration lanes keep their own selection.
#   pull_request       builds and tests only what the change can reach
#   push to main       runs everything with coverage and commits the coverage maps
#   schedule           runs everything, as the nightly safety net
on:
  pull_request:
    paths:
      - "Source/**"
      - "Benchmarks/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - ".editorconfig"
      - ".cratis/affected.json"
      - ".github/workflows/affected-tests.yml"
  # A merge runs every test with coverage and commits the maps. The commit of the maps does not start another run.
  push:
    branches: [main]
    paths-ignore:
      - ".cratis/affected/maps/**"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: auto, pr, merge or nightly.
        type: choice
        default: auto
        options: [auto, pr, merge, nightly]

permissions:
  contents: read

jobs:
  affected-tests:
    permissions:
      contents: write
    uses: Cratis/Workflows/.github/workflows/affected-tests.yml@main
    with:
      cli-version: 3.154.0
      split-merge: true
      parallelism: 2
      merge-timeout-minutes: 360
      mode: ${{ inputs.mode || 'auto' }}
      level: test
      framework: net11.0
      prepare-command: |
        dotnet nuget update source github --username cratis --password "$GITHUB_TOKEN" --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password "$GITHUB_TOKEN" --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json
        python3 .github/scripts/derive-build-version.py >> "$GITHUB_ENV"
    secrets:
      # The default branch only takes pull requests; the merge-time run commits the maps with the identity that publish.yml uses.
      map-token: ${{ secrets.PAT_WORKFLOWS }}
