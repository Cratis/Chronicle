name: Claude Assistant

# One concurrency group per issue / pull request instead of one global group:
# with the global group, a mention on one issue cancelled Claude's in-flight work
# on a completely different issue.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action exchanges the OIDC token for its GitHub App token

jobs:
  claude-response:
    # Only start a runner when Claude is actually addressed, and only for people who
    # can write to the repository. This job holds write permissions, so an outsider's
    # comment or review must never reach the action: the commenter's association must
    # be OWNER, MEMBER or COLLABORATOR as well as mentioning @claude. Issues are not a
    # trigger at all, because an issue body is untrusted input from anyone.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
      (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(git commit),Bash(git checkout),Bash(git add)"
