name: Integration Specs

on:
  workflow_call:
    outputs:
      all-providers:
        description: "Whether discovery selected all storage providers"
        value: ${{ jobs.discover.outputs.all-providers }}
    inputs:
      build-output-artifact:
        description: "Name of the DEVELOPMENT-symbol build output artifact"
        required: true
        type: string
      chronicle-image:
        description: "Chronicle Docker image to use for out-of-process tests"
        required: true
        type: string
      all-providers:
        description: "Run every storage backend rather than just the labeled PR set"
        required: false
        default: false
        type: boolean

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      client-matrix: ${{ steps.client.outputs.matrix }}
      all-providers: ${{ steps.client.outputs.all-providers }}
      kernel-matrix: ${{ steps.kernel.outputs.matrix }}
      clustering-matrix: ${{ steps.clustering.outputs.matrix }}
      rolling-upgrade-enabled: ${{ steps.exclusions.outputs.rolling-upgrade-enabled }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The generator decides what every run actually verifies, so a silent
      # change in its selection is a silent change in coverage. Its specs cost a
      # second and run before anything is discovered.
      - name: Verify the integration matrix generator
        run: python3 .github/scripts/test-generate-integration-matrix.py

      - name: Report explicitly skipped integration lanes
        id: exclusions
        run: python3 .github/scripts/integration_lane_exclusions.py

      # Each client namespace runs against the selected infrastructure configs;
      # large namespaces are additionally split into parallel shards so the
      # slowest single job no longer gates the whole run. The shard set covers
      # exactly the same tests as the un-sharded namespace -- see the script.
      # Labeled pull requests cover MongoDB plus SQLite; nightly and manual runs
      # pass all-providers to add PostgreSQL and SQL Server.
      - name: Discover Client integration namespaces
        id: client
        run: |
          echo "matrix=$(python3 .github/scripts/generate-integration-matrix.py ${ALL_PROVIDERS:+--all-providers})" >> "$GITHUB_OUTPUT"
          echo "all-providers=${{ inputs.all-providers }}" >> "$GITHUB_OUTPUT"
        env:
          ALL_PROVIDERS: ${{ inputs.all-providers && 'true' || '' }}

      - name: Discover Kernel integration namespaces
        id: kernel
        run: |
          namespaces=$(find Integration/Kernel -mindepth 1 -maxdepth 1 -type d \
            ! -name 'bin' ! -name 'obj' \
            -exec basename {} \; | sort)

          matrix='{"include":['
          for ns in $namespaces; do
            [ -z "$ns" ] && continue
            matrix+="{\"namespace\":\"Cratis.Chronicle.Kernel.Integration.${ns}\"},"
          done
          matrix="${matrix%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Discover Clustering integration namespaces
        id: clustering
        run: |
          namespaces=$(find Integration/Clustering -mindepth 1 -maxdepth 1 -type d \
            ! -name 'bin' ! -name 'obj' \
            -exec basename {} \; | sort)

          matrix='{"include":['
          for ns in $namespaces; do
            [ -z "$ns" ] && continue
            matrix+="{\"namespace\":\"Cratis.Chronicle.Integration.Clustering.${ns}\"},"
          done
          matrix="${matrix%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  client-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.client-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The integration test projects target net10.0 only (Directory.Build.props),
      # and these jobs only run already-built net10.0 assemblies, so installing the
      # 8.0/9.0 SDKs on every matrix shard is pure setup overhead. Multi-targeting
      # only happens during `dotnet pack` in the publish workflows.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build-output-artifact }}

      - name: Extract build output
        env:
          BUILD_OUTPUT_ARTIFACT: ${{ inputs.build-output-artifact }}
        run: tar -I zstd -xf "${BUILD_OUTPUT_ARTIFACT}.tar.zst"

      - name: Login to GitHub Docker Registry
        if: matrix.needs-docker == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Client project
        run: dotnet restore Integration/Client/Client.csproj

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      # Pre-pull Docker Hub images once per job so the per-fixture image
      # existence checks in Testcontainers do not race against anonymous
      # Docker Hub rate limits or transient registry timeouts. MCR-hosted
      # images (mssql) and locally built images (cratis/chronicle) do not
      # need pre-pulling.
      - name: Pre-pull Docker Hub images
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: |
            docker pull mongo:8.2
            if [ "${{ matrix.database }}" = "postgresql" ]; then
              docker pull postgres:16
            fi
            if [ "${{ matrix.database }}" = "mssql" ]; then
              docker pull mcr.microsoft.com/mssql/server:2025-latest
            fi

      - name: Run Client integration tests (${{ matrix.namespace }} ${{ matrix.shard }} | ${{ matrix.mode }} | ${{ matrix.database }})
        env:
          CRATIS_CHRONICLE_LOCAL_IMAGE: ${{ inputs.chronicle-image }}
          CHRONICLE_RUNTIME_MODE: ${{ matrix.mode }}
          CHRONICLE_STORAGE_PROVIDER: ${{ matrix.database }}
          # A genuine eventual-consistency wait settles in seconds; a wait that
          # runs for minutes is a flake, not slow progress. Cap the non-Mongo
          # backends well below the old 600s so a stuck poll costs ~150s, not 10
          # minutes, before the retry script re-runs only the failed test(s).
          CHRONICLE_TEST_TIMEOUT_SECONDS: ${{ matrix.database == 'mongodb' && '120' || '150' }}
          # Ryuk is the Testcontainers reaper sidecar. It exists to clean
          # up containers when the host process dies unexpectedly. GitHub-
          # hosted runners are destroyed after the job, so Ryuk has nothing
          # to do and its anonymous Docker Hub manifest call at session
          # init is a frequent source of flakiness. Disable it on CI.
          TESTCONTAINERS_RYUK_DISABLED: true
          # The retry script owns --results-directory; point it at ./coverage-results so the
          # collected coverage and TRX files land where the upload step reads them.
          TEST_RESULTS_DIR: ./coverage-results
        # On failure, only the failed tests are re-run (up to TEST_MAX_ATTEMPTS), so a
        # transient pipeline/container flake does not redden the whole job. A systemic
        # failure (many tests failing, e.g. a fixture/container start error) fails fast
        # without retrying, and a deterministic failure stays red on every attempt.
        #
        # --no-build: the downloaded artifact is the DEVELOPMENT-symbol build
        # from dotnet-build-development (or a labeled hot-core run), so the shard runs
        # it directly instead of recompiling the kernel from source. The restore
        # step above still regenerates project.assets.json for the test host.
        run: |
          .github/scripts/run-tests-with-retry.sh \
            Integration/Client/Client.csproj \
            "${{ matrix.filter }}" \
            --coverage

      # run-tests-with-retry.sh already writes a TRX per attempt into TEST_RESULTS_DIR.
      - name: Assert Client integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This Client integration shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-client-${{ matrix.namespace }}-${{ matrix.shard }}-${{ matrix.mode }}-${{ matrix.database }}
          path: ./coverage-results/
          retention-days: 1

  kernel-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.kernel-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The integration test projects target net10.0 only (Directory.Build.props),
      # and these jobs only run already-built net10.0 assemblies, so installing the
      # 8.0/9.0 SDKs on every matrix shard is pure setup overhead. Multi-targeting
      # only happens during `dotnet pack` in the publish workflows.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build-output-artifact }}

      - name: Extract build output
        env:
          BUILD_OUTPUT_ARTIFACT: ${{ inputs.build-output-artifact }}
        run: tar -I zstd -xf "${BUILD_OUTPUT_ARTIFACT}.tar.zst"

      - name: Restore Kernel project
        run: dotnet restore Integration/Kernel/Kernel.csproj

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      # See the equivalent step in client-integration-specs for the rationale.
      - name: Pre-pull Docker Hub images
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: docker pull mongo:8.2

      - name: Run Kernel integration tests (${{ matrix.namespace }})
        env:
          # See client-integration-specs for the rationale.
          TESTCONTAINERS_RYUK_DISABLED: true
          # The retry script owns --results-directory; point it at ./coverage-results so the
          # collected coverage and TRX files land where the upload step reads them.
          TEST_RESULTS_DIR: ./coverage-results
        # See client-integration-specs for the retry rationale. The kernel project
        # does not have Client's Docker build target.
        run: |
          .github/scripts/run-tests-with-retry.sh \
            Integration/Kernel/Kernel.csproj \
            "FullyQualifiedName~${{ matrix.namespace }}" \
            --coverage

      # run-tests-with-retry.sh already writes a TRX per attempt into TEST_RESULTS_DIR.
      - name: Assert Kernel integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This Kernel integration shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-kernel-${{ matrix.namespace }}
          path: ./coverage-results/
          retention-days: 1

  clustering-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.clustering-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # See client-integration-specs for the single-SDK rationale.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build-output-artifact }}

      - name: Extract build output
        env:
          BUILD_OUTPUT_ARTIFACT: ${{ inputs.build-output-artifact }}
        run: tar -I zstd -xf "${BUILD_OUTPUT_ARTIFACT}.tar.zst"

      - name: Restore Clustering project
        run: dotnet restore Integration/Clustering/Clustering.csproj

      - name: Restore pinned coverage tool
        run: dotnet tool restore

      - name: Run Clustering integration tests (${{ matrix.namespace }})
        env:
          # The retry script owns --results-directory; point it at ./coverage-results so the
          # collected coverage and TRX files land where the upload step reads them.
          TEST_RESULTS_DIR: ./coverage-results
        # See client-integration-specs for the retry and --no-build rationale. The clustering
        # fixture needs no containers — MongoDB comes from EphemeralMongo and the Orleans
        # cluster is in-process.
        run: |
          .github/scripts/run-tests-with-retry.sh \
            Integration/Clustering/Clustering.csproj \
            "FullyQualifiedName~${{ matrix.namespace }}" \
            --coverage

      # run-tests-with-retry.sh already writes a TRX per attempt into TEST_RESULTS_DIR.
      - name: Assert Clustering integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This Clustering integration shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-clustering-${{ matrix.namespace }}
          path: ./coverage-results/
          retention-days: 1

  sql-clustering-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, SqlServer]

    # Shared verbatim with the separately gated RollingUpgrade lane below.
    steps: &sql-clustering-steps
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.provider == 'RollingUpgrade' && '0' || '1' }}

      - name: Resolve previous release image
        if: matrix.provider == 'RollingUpgrade'
        shell: bash
        run: |
          set -euo pipefail
          release_tag=$(git tag --merged HEAD --sort=version:refname --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1) || {
            echo "::error::No release tag is an ancestor of $(git rev-parse HEAD)."
            exit 1
          }
          image_tag="${release_tag#v}-development-slim"
          metadata=$(curl --fail --silent --show-error --location --max-time 60 \
            "https://hub.docker.com/v2/repositories/cratis/chronicle/tags/${image_tag}") || {
            echo "::error::Previous release image cratis/chronicle:${image_tag} could not be resolved on Docker Hub."
            exit 1
          }
          if ! jq -e --arg tag "$image_tag" '.name == $tag and (.images | length > 0)' <<< "$metadata"; then
            echo "::error::Docker Hub returned no image for cratis/chronicle:${image_tag}."
            exit 1
          fi
          echo "Previous release: ${release_tag}; image: cratis/chronicle:${image_tag}"
          echo "CRATIS_CHRONICLE_PREVIOUS_IMAGE=cratis/chronicle:${image_tag}" >> "$GITHUB_ENV"

          # The client under test must report a version above the previous release. The compatibility check
          # orders the two sides by protocol version, and an unstamped build reports 1.0.0, so it would be
          # treated as the older side and refused for every additive contract element (#5353).
          if [[ ! "$release_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Cannot derive a client version from release tag '${release_tag}'."
            exit 1
          fi
          client_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "Client under test is stamped ${client_version}"
          echo "CRATIS_CHRONICLE_CLIENT_VERSION=${client_version}" >> "$GITHUB_ENV"

      # See client-integration-specs for the single-SDK rationale.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build-output-artifact }}

      - name: Extract build output
        env:
          BUILD_OUTPUT_ARTIFACT: ${{ inputs.build-output-artifact }}
        run: tar -I zstd -xf "${BUILD_OUTPUT_ARTIFACT}.tar.zst"

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore SQL clustering project
        run: dotnet restore Integration/SqlClustering/SqlClustering.csproj

      # Only the client side is rebuilt with the stamped version: the new kernel image keeps the shared build, and
      # the client then compares as newer than both the previous release and this build's kernel.
      - name: Rebuild the client under test with a version above the previous release
        if: matrix.provider == 'RollingUpgrade'
        run: >-
          dotnet build Integration/SqlClustering/SqlClustering.csproj --no-restore -c Release
          -p:EnableDevelopmentSymbol=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true
          -p:Version="$CRATIS_CHRONICLE_CLIENT_VERSION"

      - name: Pre-pull images
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: |
            docker pull "${{ inputs.chronicle-image }}"
            if [ "${{ matrix.provider }}" = "RollingUpgrade" ]; then
              docker pull "$CRATIS_CHRONICLE_PREVIOUS_IMAGE"
            fi
            if [ "${{ matrix.provider }}" != "SqlServer" ]; then
              docker pull postgres:16
            else
              docker pull mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
            fi

      # Three kernel containers from the image the Client shards use. No retries: an append that
      # fails during a membership transition is part of the availability measurement.
      - name: Run SQL clustering specifications (${{ matrix.provider }})
        env:
          CRATIS_CHRONICLE_LOCAL_IMAGE: ${{ inputs.chronicle-image }}
          TESTCONTAINERS_RYUK_DISABLED: true
          CRATIS_CHRONICLE_DIAGNOSTIC_LOG_DIRECTORY: ${{ matrix.provider == 'RollingUpgrade' && format('{0}/coverage-results/kernel-logs', github.workspace) || '' }}
        run: >-
          node .github/scripts/run-spec-project.mjs --project Integration/SqlClustering/SqlClustering.csproj
          --filter "FullyQualifiedName~Cratis.Chronicle.Integration.SqlClustering.${{ matrix.provider }}"
          --results-directory coverage-results

      # Diagnostic for #5417: print the Orleans Debug logs of the old and new kernels into the job log.
      - name: Print kernel logs (RollingUpgrade)
        if: always() && matrix.provider == 'RollingUpgrade'
        shell: bash
        run: |
          if [ -f coverage-results/kernel-logs/kernel-logs.txt ]; then
            echo "::group::kernel logs"
            cat coverage-results/kernel-logs/kernel-logs.txt
            echo "::endgroup::"
          else
            echo "No kernel logs were written."
          fi

      - name: Assert SQL clustering specifications ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This SQL clustering provider

      - name: Upload SQL clustering results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-clustering-${{ matrix.provider }}-results
          path: coverage-results/
          retention-days: 7

  # A job-level condition (not a successful zero-spec run) makes the excluded lane visibly skipped.
  # Its reason and issue links are in discovery's summary; remove only the declaration to re-enable.
  sql-clustering-rolling-upgrade:
    name: SQL clustering (RollingUpgrade)
    needs: [discover]
    if: needs.discover.outputs.rolling-upgrade-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Replace nodes from the latest release one at a time under load on PostgreSQL (#5272).
        provider: [RollingUpgrade]
    steps: *sql-clustering-steps
