name: Integration Specs

on:
  workflow_call:
    inputs:
      dotnet-cache-key:
        description: "Cache key for dotnet build artifacts"
        required: true
        type: string
      chronicle-image:
        description: "Chronicle Docker image to use for out-of-process tests"
        required: true
        type: string
      all-providers:
        description: "Run every storage backend rather than just the pull request set"
        required: false
        default: false
        type: boolean

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      client-matrix: ${{ steps.client.outputs.matrix }}
      kernel-matrix: ${{ steps.kernel.outputs.matrix }}
      clustering-matrix: ${{ steps.clustering.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The generator decides what every run actually verifies, so a silent
      # change in its selection is a silent change in coverage. Its specs cost a
      # second and run before anything is discovered.
      - name: Verify the integration matrix generator
        run: python3 .github/scripts/test-generate-integration-matrix.py

      # Each client namespace runs against the selected infrastructure configs;
      # large namespaces are additionally split into parallel shards so the
      # slowest single job no longer gates the whole run. The shard set covers
      # exactly the same tests as the un-sharded namespace -- see the script.
      # Pull requests cover MongoDB plus SQLite, so every pull request exercises
      # one non-Mongo storage backend; the nightly schedule and manual dispatch
      # pass all-providers to add PostgreSQL and SQL Server.
      - name: Discover Client integration namespaces
        id: client
        run: |
          echo "matrix=$(python3 .github/scripts/generate-integration-matrix.py ${ALL_PROVIDERS:+--all-providers})" >> "$GITHUB_OUTPUT"
        env:
          ALL_PROVIDERS: ${{ inputs.all-providers && 'true' || '' }}

      - name: Discover Kernel integration namespaces
        id: kernel
        run: |
          namespaces=$(find Integration/Kernel -mindepth 1 -maxdepth 1 -type d \
            ! -name 'bin' ! -name 'obj' \
            -exec basename {} \; | sort)

          matrix='{"include":['
          for ns in $namespaces; do
            [ -z "$ns" ] && continue
            matrix+="{\"namespace\":\"Cratis.Chronicle.Kernel.Integration.${ns}\"},"
          done
          matrix="${matrix%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Discover Clustering integration namespaces
        id: clustering
        run: |
          namespaces=$(find Integration/Clustering -mindepth 1 -maxdepth 1 -type d \
            ! -name 'bin' ! -name 'obj' \
            -exec basename {} \; | sort)

          matrix='{"include":['
          for ns in $namespaces; do
            [ -z "$ns" ] && continue
            matrix+="{\"namespace\":\"Cratis.Chronicle.Integration.Clustering.${ns}\"},"
          done
          matrix="${matrix%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  client-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.client-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The integration test projects target net10.0 only (Directory.Build.props),
      # and these jobs only run already-built net10.0 assemblies, so installing the
      # 8.0/9.0 SDKs on every matrix shard is pure setup overhead. Multi-targeting
      # only happens during `dotnet pack` in the publish workflows.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore build output
        uses: actions/cache@v4
        with:
          path: ./**/bin
          key: ${{ inputs.dotnet-cache-key }}

      - name: Login to GitHub Docker Registry
        if: matrix.needs-docker == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Client project
        run: dotnet restore Integration/Client/Client.csproj

      # Pre-pull Docker Hub images once per job so the per-fixture image
      # existence checks in Testcontainers do not race against anonymous
      # Docker Hub rate limits or transient registry timeouts. MCR-hosted
      # images (mssql) and locally built images (cratis/chronicle) do not
      # need pre-pulling.
      - name: Pre-pull Docker Hub images
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: |
            docker pull mongo
            if [ "${{ matrix.database }}" = "postgresql" ]; then
              docker pull postgres:16
            fi
            if [ "${{ matrix.database }}" = "mssql" ]; then
              docker pull mcr.microsoft.com/mssql/server:2025-latest
            fi

      - name: Run Client integration tests (${{ matrix.namespace }} ${{ matrix.shard }} | ${{ matrix.mode }} | ${{ matrix.database }})
        env:
          CRATIS_CHRONICLE_LOCAL_IMAGE: ${{ inputs.chronicle-image }}
          CHRONICLE_RUNTIME_MODE: ${{ matrix.mode }}
          CHRONICLE_STORAGE_PROVIDER: ${{ matrix.database }}
          # A genuine eventual-consistency wait settles in seconds; a wait that
          # runs for minutes is a flake, not slow progress. Cap the non-Mongo
          # backends well below the old 600s so a stuck poll costs ~150s, not 10
          # minutes, before the retry script re-runs only the failed test(s).
          CHRONICLE_TEST_TIMEOUT_SECONDS: ${{ matrix.database == 'mongodb' && '120' || '150' }}
          # Ryuk is the Testcontainers reaper sidecar. It exists to clean
          # up containers when the host process dies unexpectedly. GitHub-
          # hosted runners are destroyed after the job, so Ryuk has nothing
          # to do and its anonymous Docker Hub manifest call at session
          # init is a frequent source of flakiness. Disable it on CI.
          TESTCONTAINERS_RYUK_DISABLED: true
          # The retry script owns --results-directory; point it at ./coverage-results so the
          # collected coverage and TRX files land where the upload step reads them.
          TEST_RESULTS_DIR: ./coverage-results
        # On failure, only the failed tests are re-run (up to TEST_MAX_ATTEMPTS), so a
        # transient pipeline/container flake does not redden the whole job. A systemic
        # failure (many tests failing, e.g. a fixture/container start error) fails fast
        # without retrying, and a deterministic failure stays red on every attempt.
        #
        # --no-build: the restored cache is the DEVELOPMENT-symbol build from
        # dotnet-build-development, so the shard runs it directly instead of
        # recompiling the kernel from source. The restore step above still
        # regenerates project.assets.json and the package cache for the test host.
        run: |
          .github/scripts/run-tests-with-retry.sh \
            Integration/Client/Client.csproj \
            "${{ matrix.filter }}" \
            -p:DisableDockerBuild=true \
            --no-build \
            --collect:"XPlat Code Coverage"

      # run-tests-with-retry.sh already writes a TRX per attempt into TEST_RESULTS_DIR.
      - name: Assert Client integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This Client integration shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-client-${{ matrix.namespace }}-${{ matrix.shard }}-${{ matrix.mode }}-${{ matrix.database }}
          path: ./coverage-results/
          retention-days: 1

  kernel-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.kernel-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The integration test projects target net10.0 only (Directory.Build.props),
      # and these jobs only run already-built net10.0 assemblies, so installing the
      # 8.0/9.0 SDKs on every matrix shard is pure setup overhead. Multi-targeting
      # only happens during `dotnet pack` in the publish workflows.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore build output
        uses: actions/cache@v4
        with:
          path: ./**/bin
          key: ${{ inputs.dotnet-cache-key }}

      - name: Restore Kernel project
        run: dotnet restore Integration/Kernel/Kernel.csproj

      # See the equivalent step in client-integration-specs for the rationale.
      - name: Pre-pull Docker Hub images
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: docker pull mongo

      - name: Run Kernel integration tests (${{ matrix.namespace }})
        env:
          # See client-integration-specs for the rationale.
          TESTCONTAINERS_RYUK_DISABLED: true
          # The retry script owns --results-directory; point it at ./coverage-results so the
          # collected coverage and TRX files land where the upload step reads them.
          TEST_RESULTS_DIR: ./coverage-results
        # See client-integration-specs for the retry rationale. The kernel project
        # does not have Client's Docker build target.
        run: |
          .github/scripts/run-tests-with-retry.sh \
            Integration/Kernel/Kernel.csproj \
            "FullyQualifiedName~${{ matrix.namespace }}" \
            --no-build \
            --collect:"XPlat Code Coverage"

      # run-tests-with-retry.sh already writes a TRX per attempt into TEST_RESULTS_DIR.
      - name: Assert Kernel integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This Kernel integration shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-kernel-${{ matrix.namespace }}
          path: ./coverage-results/
          retention-days: 1

  clustering-integration-specs:
    needs: [discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.clustering-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # See client-integration-specs for the single-SDK rationale.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore build output
        uses: actions/cache@v4
        with:
          path: ./**/bin
          key: ${{ inputs.dotnet-cache-key }}

      - name: Restore Clustering project
        run: dotnet restore Integration/Clustering/Clustering.csproj

      - name: Run Clustering integration tests (${{ matrix.namespace }})
        env:
          # The retry script owns --results-directory; point it at ./coverage-results so the
          # collected coverage and TRX files land where the upload step reads them.
          TEST_RESULTS_DIR: ./coverage-results
        # See client-integration-specs for the retry and --no-build rationale. The clustering
        # fixture needs no containers — MongoDB comes from EphemeralMongo and the Orleans
        # cluster is in-process.
        run: |
          .github/scripts/run-tests-with-retry.sh \
            Integration/Clustering/Clustering.csproj \
            "FullyQualifiedName~${{ matrix.namespace }}" \
            --no-build \
            --collect:"XPlat Code Coverage"

      # run-tests-with-retry.sh already writes a TRX per attempt into TEST_RESULTS_DIR.
      - name: Assert Clustering integration tests ran
        uses: ./.github/actions/assert-tests-ran
        with:
          path: ./coverage-results
          name: This Clustering integration shard

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-clustering-${{ matrix.namespace }}
          path: ./coverage-results/
          retention-days: 1
