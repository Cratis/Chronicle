name: Publish
# Closed-unmerged trigger probe; this branch is never merged.

# Publish runs are grouped per pull request, and never cancelled.
#
# Under the pull_request trigger github.ref is refs/pull/<N>/merge, so this group is unique to one
# pull request: simultaneous merges never cancel one another's publish run, and with
# cancel-in-progress off a run that has started always finishes and cuts its version. It does not
# serialize releases. Choosing the next version is a read then a create, so two runs still read the
# same latest version and race to create it - merging eleven pull requests in two minutes on
# 2026-08-18 gave five runs all computing v16.35.7 and four 403s from secondary rate limiting.
# A constant group would not fix that and must not be introduced: GitHub keeps only one pending run
# per group and cancels the earlier pending one, so a third merge silently drops the second's
# release, which is worse than a noisy 403. The real fix is to stop deriving the version from a
# read-then-create race - retry the create with backoff, or decouple release from merge so only one
# release run exists at a time (task 2.2 in PLAN-reliability-program.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET8_VERSION: "8.0.410"
  DOTNET9_VERSION: "9.0.x"
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    types: [closed]
    # Only a pull request into main releases. On "**" every base branch released, so merging one pull
    # request into another one's branch - the ordinary way to stack work - cut and published a version
    # from a branch that was still in review. That is how Cratis.Fundamentals v7.17.0 came to be
    # published from the head of an open pull request, carrying every unmerged change on that branch
    # under release notes describing only the one that had just merged. A release must come from the
    # branch that is released.
    branches:
      - main
    paths:
      - "Source/**"
      # Image definitions ship in the published Docker images, so a Docker-only
      # change (e.g. a Dockerfile or entrypoint fix) must be able to cut a release.
      - "Docker/**"
      # Changes to the publish pipeline itself should be exercised by a release.
      - ".github/workflows/publish.yml"
      # Central package management decides what the published packages depend on, so a version bump here
      # changes what a consumer restores even though no file under Source changed. Without this the bump
      # merged and cut nothing, leaving main referencing one version and the published packages another -
      # a difference nothing reports, because the workflow that would have reported it never ran.
      - "Directory.Packages.props"
      - "Directory.Build.props"


permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  release:
    # A pull request closed without merging has nothing to release. Skipping early also keeps those runs from
    # doing any work at all, on top of the concurrency key above keeping them out of each other's way.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  generate-protos:
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    uses: ./.github/workflows/generate-protos.yml

  coverage-statistics:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_WORKFLOWS }}

      - name: Restore cached coverage
        uses: actions/cache@v4
        with:
          path: ./coverage-reports
          key: coverage-cache-${{ github.sha }}
          fail-on-cache-miss: false

      - name: Collect coverage statistics for release
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          .github/scripts/collect-coverage.sh \
            "./coverage-reports" \
            "./Documentation/statistics/coverage-data.js" \
            "${{ needs.release.outputs.version }}" \
            "${{ github.sha }}" \
            "$HEAD_COMMIT_MESSAGE"

      - name: Commit coverage statistics
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Documentation/statistics/coverage-data.js
          if git diff --staged --quiet; then
            echo "No coverage statistics changes to commit"
          else
            git commit -m "Update coverage statistics for release ${{ needs.release.outputs.version }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

  # Benchmark results are committed by benchmarks.yml when it runs on main, so there is no longer a cache
  # written on the pull request for a release to restore.

  dotnet-x64:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Build x64 Kernel - self contained, ready to run
        working-directory: ./Source/Kernel/Server
        run: |
          dotnet publish -c Release -f net10.0 -r linux-x64 -p:PublishReadyToRun=true -p:DisableProxyGenerator=true -p:Version=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }} --self-contained -o out/x64

      - name: Upload x64 kernel output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-x64
          path: ./Source/Kernel/Server/out/x64

  dotnet-arm64:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Build arm64 Kernel - self contained, ready to run
        working-directory: ./Source/Kernel/Server
        run: |
          dotnet publish -c Release -f net10.0 -r linux-arm64 -p:PublishReadyToRun=true -p:DisableProxyGenerator=true -p:Version=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }} --self-contained -o out/arm64

      - name: Upload arm64 kernel output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-arm64
          path: ./Source/Kernel/Server/out/arm64

  workbench:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        working-directory: ./Source/Workbench
        run: yarn install

      - name: Build Workbench
        working-directory: ./Source/Workbench
        run: |
          yarn build
        env:
          CHRONICLE_VERSION: ${{ needs.release.outputs.version }}
          CHRONICLE_COMMIT_SHA: ${{ github.sha }}
          # PrimeReact 11 is commercially licensed and verifies a key at runtime; a released Workbench
          # without one shows an "Invalid PrimeUI License" banner. See https://primeui.dev/licenses/community
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}

      - name: Upload workbench output
        uses: actions/upload-artifact@v4
        with:
          name: workbench
          path: ./Source/Workbench/wwwroot

  dotnet-pack-and-publish:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, dotnet-x64, dotnet-arm64, workbench, dotnet-x64-development, dotnet-arm64-development]
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download workbench output
        uses: actions/download-artifact@v4
        with:
          name: workbench
          path: ./Source/Workbench/wwwroot

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Build and Create NuGet packages
        run: |
          find ./Source/Clients -name "*.csproj" ! -name "*.Specs.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet pack "$project" --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:IsPackaging=true -p:Version=${{ needs.release.outputs.version }} -p:PackageVersion=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }}
          done
          # Also pack the Contracts project from Kernel
          dotnet pack ./Source/Kernel/Contracts/Contracts.csproj --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:IsPackaging=true -p:Version=${{ needs.release.outputs.version }} -p:PackageVersion=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }}

      # Nothing else in this repository installs Chronicle beside the Arc packages that build on it,
      # so this is the only place the combination an application actually gets is exercised. It runs
      # before the push because afterwards the version exists and cannot be taken back.
      - name: Start the packages beside the current Arc packages
        run: bash ./.github/scripts/verify-consumer-smoke.sh "${{ needs.release.outputs.version }}" "${{ env.NUGET_OUTPUT }}"

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  notify-arc:
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, dotnet-pack-and-publish]

    steps:
      - name: Trigger Chronicle update on Arc
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: cratis/arc
          event-type: chronicle-published
          client-payload: '{"version": "${{ needs.release.outputs.version }}"}'

  publish-typescript-client:
    if: needs.release.outputs.publish == 'true'
    needs: [release, generate-protos]
    uses: ./.github/workflows/publish-typescript-client.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      protos-artifact: proto-files

  publish-kotlin-client:
    if: needs.release.outputs.publish == 'true'
    needs: [release, generate-protos]
    uses: ./.github/workflows/publish-kotlin-client.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      protos-artifact: proto-files

  publish-elixir-client:
    if: needs.release.outputs.publish == 'true'
    needs: [release, generate-protos]
    uses: ./.github/workflows/publish-elixir-client.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      protos-artifact: proto-files

  publish-python-client:
    if: needs.release.outputs.publish == 'true'
    needs: [release, generate-protos]
    uses: ./.github/workflows/publish-python-client.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      protos-artifact: proto-files

  # The development kernel is built Release, like the release kernel - the development part is the DEVELOPMENT
  # symbol passed below, not the configuration. Nothing is lost by optimizing it: DefineConstants resolves to
  # DEVELOPMENT alone in both configurations (the global property overrides the DEBUG the Debug configuration
  # would otherwise add), and there is no #if DEBUG, Debug.Assert or [Conditional("DEBUG")] anywhere in Source,
  # so no conditional code changes - only Optimize. It was built Debug until the unoptimized kernel showed up as
  # startup cost in every container based on this image: the kernel's boot is serial and CPU-bound, so it lands
  # directly on time-to-ready on slower cloud vCPUs.
  dotnet-x64-development:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Build development x64 Kernel (DEVELOPMENT symbol)
        working-directory: ./Source/Kernel/Server
        run: |
          dotnet publish -c Release -f net10.0 -r linux-x64 -p:DefineConstants=DEVELOPMENT -p:Version=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }} -o out/x64

      - name: Upload x64 development kernel output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-x64-development
          path: ./Source/Kernel/Server/out/x64

  dotnet-arm64-development:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Build development arm64 Kernel (DEVELOPMENT symbol)
        working-directory: ./Source/Kernel/Server
        run: |
          dotnet publish -c Release -f net10.0 -r linux-arm64 -p:DefineConstants=DEVELOPMENT -p:Version=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }} -o out/arm64

      - name: Upload arm64 development kernel output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-arm64-development
          path: ./Source/Kernel/Server/out/arm64

  publish-docker-production:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, dotnet-x64, dotnet-arm64, workbench, dotnet-x64-development, dotnet-arm64-development]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 kernel output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-x64
          path: ./Source/Kernel/Server/out/x64

      - name: Download arm64 kernel output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-arm64
          path: ./Source/Kernel/Server/out/arm64

      - name: Download workbench output
        uses: actions/download-artifact@v4
        with:
          name: workbench
          path: ./Source/Workbench/wwwroot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker tags
        id: docker-tags
        run: |
          TAGS="cratis/chronicle:${{ needs.release.outputs.version }}"
          if [ "${{ needs.release.outputs.prerelease }}" != "true" ]; then
            TAGS="${TAGS}\ncratis/chronicle:latest"
          fi
          {
            echo "tags<<EOF"
            printf '%b\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Docker/Production/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

      # Every image variant lands in the same Docker Hub repository, so the overview is updated here only.
      # The description API needs a token with write scope, which the push credentials do not necessarily
      # have - never fail a release over an overview that did not update.
      - name: Update Docker Hub overview
        id: dockerhub-overview
        if: needs.release.outputs.prerelease != 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: cratis/chronicle
          readme-filepath: ./Docker/README.md
          short-description: "Event sourcing engine - stores events as the source of truth and derives read models from them."

      # continue-on-error above keeps an overview problem from failing a release, but it also reports the step as
      # successful, so a rejected update is invisible unless someone opens the log. Surface it in the run summary.
      - name: Report an overview that did not update
        if: steps.dockerhub-overview.outcome == 'failure'
        run: |
          echo "::warning title=Docker Hub overview not updated::The description API rejected the update, so the published overview is stale. The Docker Hub description API needs a token with write or admin scope - a push-only DOCKER_PASSWORD is rejected with Forbidden."
          {
            echo "### Docker Hub overview not updated"
            echo
            echo "The description API rejected the update, so the overview on \`cratis/chronicle\` is stale."
            echo "It needs \`DOCKER_PASSWORD\` to be a token with write or admin scope; a push-only token is rejected with \`Forbidden\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-docker-workbench:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, dotnet-x64, dotnet-arm64, workbench, dotnet-x64-development, dotnet-arm64-development]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download workbench output
        uses: actions/download-artifact@v4
        with:
          name: workbench
          path: ./Source/Workbench/wwwroot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker tags
        id: docker-tags
        run: |
          TAGS="cratis/chronicle:${{ needs.release.outputs.version }}-workbench"
          if [ "${{ needs.release.outputs.prerelease }}" != "true" ]; then
            TAGS="${TAGS}\ncratis/chronicle:latest-workbench"
          fi
          {
            echo "tags<<EOF"
            printf '%b\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Workbench Image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Docker/Workbench/Dockerfile
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

  publish-docker-development:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, dotnet-x64, dotnet-arm64, workbench, dotnet-x64-development, dotnet-arm64-development]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 development kernel output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-x64-development
          path: ./Source/Kernel/Server/out/x64

      - name: Download arm64 development kernel output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-arm64-development
          path: ./Source/Kernel/Server/out/arm64

      - name: Download workbench output
        uses: actions/download-artifact@v4
        with:
          name: workbench
          path: ./Source/Workbench/wwwroot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker tags
        id: docker-tags
        run: |
          TAGS="cratis/chronicle:${{ needs.release.outputs.version }}-development"
          if [ "${{ needs.release.outputs.prerelease }}" != "true" ]; then
            TAGS="${TAGS}\ncratis/chronicle:latest-development"
          fi
          {
            echo "tags<<EOF"
            printf '%b\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Development Docker Image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Docker/Development/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: cratis/documentation
          event-type: build-docs

      - name: Trigger Dependency Updates on Sample Repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: cratis/samples
          event-type: update-dependencies

  publish-docker-development-slim:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, dotnet-x64, dotnet-arm64, workbench, dotnet-x64-development, dotnet-arm64-development]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 development kernel output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-x64-development
          path: ./Source/Kernel/Server/out/x64

      - name: Download arm64 development kernel output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-arm64-development
          path: ./Source/Kernel/Server/out/arm64

      - name: Download workbench output
        uses: actions/download-artifact@v4
        with:
          name: workbench
          path: ./Source/Workbench/wwwroot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker tags
        id: docker-tags
        run: |
          TAGS="cratis/chronicle:${{ needs.release.outputs.version }}-development-slim"
          if [ "${{ needs.release.outputs.prerelease }}" != "true" ]; then
            TAGS="${TAGS}\ncratis/chronicle:latest-development-slim"
          fi
          {
            echo "tags<<EOF"
            printf '%b\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Development Slim Docker Image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Docker/DevelopmentSlim/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

  verify-published-docker-tags:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs:
      - release
      - publish-docker-production
      - publish-docker-workbench
      - publish-docker-development
      - publish-docker-development-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify published Docker tags
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          python3 .github/scripts/verify-published-docker-tags.py \
            --version "$RELEASE_VERSION" \
            --prerelease "$RELEASE_PRERELEASE"

  verify-published:
    # A merged pull request that publishes nothing is the failure mode that silently costs a release: the release
    # job succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did. workflow_dispatch is excluded
    # because a manual run may legitimately resolve to no publish.
    #
    # A pull request labelled no-release published nothing on purpose - it changed no shipped behavior - so this
    # check would be reporting the intended outcome as a failure, and a job that cries wolf on the common case
    # stops being read. verify-semver-label guarantees the label is a deliberate choice rather than an omission,
    # which is what makes it safe to trust here.
    if: always() && github.event_name == 'pull_request' && needs.release.result == 'success' && needs.release.outputs.publish != 'true' && !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::The release action reported should-publish: false for a merged pull request, so no packages were published and no release was cut. The usual cause is a missing major, minor or patch label - see verify-semver-label."
          exit 1
