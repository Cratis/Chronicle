---
name: TypeScript Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

"on":
  workflow_dispatch:
  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "Source/Clients/TypeScript/**"
      - "Source/Kernel/Contracts/**"
      - "Source/Kernel/Protobuf/**"
      - "Source/Tools/ProtoGenerator/**"
      - ".github/workflows/typescript-build.yml"

permissions:
  contents: read

jobs:
  # The common affected-frontend workflow (Cratis/Workflows) decides whether the change reaches the client. The TypeScript client
  # is generated from the wire contract, so a change to the contracts, the generated protos or the generator reaches it.
  affected-frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: Cratis/Workflows/.github/workflows/affected-frontend.yml@main
    with:
      working-directory: Source/Clients/TypeScript
      node-version: 24.x
      dotnet-version: 11.0.x
      # No lockfile to key a cache on.
      corepack: false
      yarn-cache: false
      install-command: yarn install --ignore-scripts
      legs: build,check:consumers
      global-paths: |
        Source/Kernel/Contracts/**
        Source/Kernel/Protobuf/**
        Source/Tools/ProtoGenerator/**
        .github/workflows/typescript-build.yml
      # Regenerates the protos from the contracts, which `yarn build` then turns into TypeScript.
      prepare-command: |
        PROTOC_VERSION="28.3"
        PROTOC_ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        curl -OL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
        sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc
        sudo unzip -o "$PROTOC_ZIP" -d /usr/local 'include/*'
        rm -f "$PROTOC_ZIP"
        protoc --version
        (cd Source/Kernel/Contracts && dotnet build -c Release)
        CONTRACTS_DLL="Source/Kernel/Contracts/bin/Release/net11.0/Cratis.Chronicle.Contracts.dll"
        dotnet run --project Source/Tools/ProtoGenerator/ProtoGenerator.csproj -- "$CONTRACTS_DLL" Source/Kernel/Protobuf
