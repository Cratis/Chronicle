name: Update Packages

on:
  schedule:
    - cron: '59 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      # StyleCop.Analyzers stays held, as in the reusable workflow's default. Castle.Core stays on 5.1.1:
      # 5.2.1 breaks NSubstitute class proxies (https://github.com/Cratis/Chronicle/issues/5414).
      # Cratis.Arc (the whole Cratis.Arc family), OpenTelemetry and OpenIddict stay on versions whose net11.0
      # targets do not require .NET 11 runtime packages (NU1605) until
      # https://github.com/Cratis/Chronicle/issues/6160 is done. Cratis.Choreography waits for
      # https://github.com/Cratis/Chronicle/issues/6161 and Cratis.Screenplay for
      # https://github.com/Cratis/Chronicle/issues/6162. Matching is exact, so every held ID is listed.
      # Setting this input replaces the default, so StyleCop.Analyzers is listed too.
      nuget-package-exclusions: StyleCop.Analyzers,Castle.Core,Cratis.Arc,Cratis.Choreography,Cratis.Screenplay,OpenIddict.AspNetCore,OpenTelemetry,OpenTelemetry.Exporter.InMemory,OpenTelemetry.Exporter.OpenTelemetryProtocol,OpenTelemetry.Extensions.Hosting,OpenTelemetry.Instrumentation.AspNetCore,OpenTelemetry.Instrumentation.GrpcNetClient,OpenTelemetry.Instrumentation.Http,OpenTelemetry.Instrumentation.Runtime
      publication-mode: pull-request
      pull-request-label: patch
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
