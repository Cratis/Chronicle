name: Update Packages

on:
  schedule:
    - cron: '59 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      # StyleCop.Analyzers stays held, as in the reusable workflow's default. Castle.Core stays on 5.1.1:
      # 5.2.1 breaks NSubstitute class proxies (https://github.com/Cratis/Chronicle/issues/5414).
      # Cratis.Arc stays held until the remaining runtime verification for
      # https://github.com/Cratis/Chronicle/issues/6160 is complete. Cratis.Choreography waits for
      # https://github.com/Cratis/Chronicle/issues/6161. Matching is exact; these IDs do not hold entire families.
      # Setting this input replaces the default, so StyleCop.Analyzers is listed too.
      nuget-package-exclusions: StyleCop.Analyzers,Castle.Core,Cratis.Arc,Cratis.Choreography
      publication-mode: pull-request
      pull-request-label: patch
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
