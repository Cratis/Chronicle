name: Update Packages

on:
  schedule:
    - cron: '59 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      # Castle.Core is pinned in Directory.Packages.props: 5.2.x breaks NSubstitute class proxies.
      # Cratis.Screenplay 4.141 changes the capture and projection languages; adopt it deliberately
      # (https://github.com/Cratis/Chronicle/issues/4799) and then remove it from this list.
      nuget-package-exclusions: Castle.Core
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
