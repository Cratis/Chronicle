name: Workbench Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "Source/Workbench/**"
      - ".github/workflows/workbench-build.yml"

permissions:
  contents: read

jobs:
  # The common affected-frontend workflow (Cratis/Workflows) decides whether the change reaches the Workbench at all: a change
  # to documentation or to files the build cannot read starts no job beyond the check itself.
  affected-frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: Cratis/Workflows/.github/workflows/affected-frontend.yml@main
    with:
      working-directory: Source/Workbench
      node-version: 24.x
      node-options: --max-old-space-size=4096
      # The Workbench is built with the Yarn the runner provides, and its cache is saved from main by workbench-yarn-cache.yml.
      corepack: false
      cache-path: Source/Workbench/.yarn/cache
      install-command: yarn install
      legs: ci
      global-paths: |
        .github/workflows/workbench-build.yml
    secrets:
      # PrimeReact 11 is commercially licensed and verifies a key at runtime. Absent on a fork's pull
      # request, where secrets are not exposed - the build still succeeds, the bundle just carries no
      # key. See https://primeui.dev/licenses/community
      primeui-license: ${{ secrets.PRIMEUI_LICENSE }}
