name: Workbench Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "Source/Workbench/**"
      - ".github/scripts/npm-version-exists.mjs"
      - ".github/scripts/test-npm-version-exists.mjs"
      - ".github/workflows/workbench-build.yml"

jobs:
  node-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Restore Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@main
        id: yarn-cache
        with:
          working-directory: Source/Workbench
          path: Source/Workbench/.yarn/cache
          mode: restore

      - name: Yarn install
        working-directory: ./Source/Workbench
        run: yarn install

      - name: Build JS/TS
        working-directory: ./Source/Workbench
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci
        env:
          # PrimeReact 11 is commercially licensed and verifies a key at runtime. Absent on a fork's pull
          # request, where secrets are not exposed - the build still succeeds, the bundle just carries no
          # key. See https://primeui.dev/licenses/community
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}

      # Consumes the packed @cratis/chronicle-ui tarball from a project outside the checkout. Deliberately
      # without PRIMEUI_LICENSE: the package must build and resolve without any application secret.
      - name: Check packed Chronicle UI consumers
        working-directory: ./Source/Workbench
        run: |
          node --test packages/chronicle-ui/inspect-pack.test.mjs ../../.github/scripts/test-npm-version-exists.mjs
          yarn workspace @cratis/chronicle-ui check:consumers
