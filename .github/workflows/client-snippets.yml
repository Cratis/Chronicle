name: Client Snippet Verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GA follow-up: drop DOTNET_QUALITY, set global.json to 11.0.100 and remove allowPrerelease.
  DOTNET_VERSION: "11.0.x"
  DOTNET_QUALITY: preview

on:
  workflow_dispatch:

  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "Documentation/client-snippets/**"
      - "Documentation/validate-client-snippets.py"
      - "Source/**"
      - "Directory.Packages.props"
      - "Directory.Packages.NET8.props"
      - "Directory.Packages.NET9.props"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - ".globalconfig"
      - ".editorconfig"
      - ".github/workflows/client-snippets.yml"

permissions:
  contents: read
  packages: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      # Shared org cache: pull requests restore only; the nightly build and default-branch runs save (Cratis/Workflows#164).
      - name: Cache NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json

      - name: Compile client snippets
        run: python3 Documentation/validate-client-snippets.py
