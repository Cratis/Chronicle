# Detect hot-core changes on every PR push; fail the gate until requested integration passes
# for the head commit. The refresh workflow re-runs the same gate without another push.
# This workflow has no paths filter so detection covers documentation-only PRs too.

name: Hot Core Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"

env:
  DOTNET8_VERSION: "8.0.410"
  DOTNET9_VERSION: "9.0.x"
  DOTNET_VERSION: "10.0.x"
  # Own image tag; this workflow builds and uploads its own output for its matrix.
  HOT_CORE_IMAGE: "ghcr.io/cratis/chronicle:hot-core-${{ github.sha }}"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      touched: ${{ steps.detect.outputs.touched }}

    steps:
      # The full history is what makes the diff against the base commit possible; the default
      # shallow fetch does not contain it.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on every pull request, hot core or not, because a pattern that has stopped matching any
      # file - a rename - disarms the gate without failing anything, and a pattern with no owner
      # disarms the review half the same way.
      - name: Assert the hot-core contract is intact
        run: |
          python3 .github/scripts/test-detect-hot-core-changes.py
          python3 .github/scripts/test-evaluate-hot-core-gate.py
          python3 .github/scripts/detect-hot-core-changes.py --verify

      # Prints every matched path and, on ordinary pushes, how to request integration.
      - name: Detect hot-core changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_INTEGRATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Manual run - there is no pull request to diff, so the full matrix runs unconditionally."
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/detect-hot-core-changes.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # Manual dispatch retains its original full hot-core matrix; ordinary pushes do not build it.
  build:
    needs: [detect]
    if: needs.detect.outputs.touched == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      chronicle-image: ${{ steps.export.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore obj cache
        uses: actions/cache@v4
        with:
          # Package-aware key, as in `.NET Build & Integration`: a dependency bump must not restore
          # an obj cache built against a different package set.
          path: ./**/obj
          key: hot-core-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-${{ github.sha }}
          restore-keys: |
            hot-core-obj-cache-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}-

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text https://nuget.pkg.github.com/cratis/index.json

      # The integration shards run `--no-build` against this DEVELOPMENT-symbol build.
      - name: Build with DEVELOPMENT symbol
        run: dotnet build --configuration Release -p:EnableDevelopmentSymbol=true -p:DisableProxyGenerator=true -p:DisableDockerBuild=true

      # The out-of-process shards start this image instead of hosting the kernel themselves, so
      # without it there is no "out of process" to test.
      - name: Build and push development Docker image
        run: |
          dotnet publish Source/Kernel/Server/Server.csproj \
            --configuration Debug \
            --no-restore \
            -o Source/Kernel/Server/out
          docker build -t "${{ env.HOT_CORE_IMAGE }}" -f Docker/Local/Dockerfile .
          docker push ${{ env.HOT_CORE_IMAGE }}

      - name: Pack hot-core build output
        run: |
          set -euo pipefail
          for project in Integration/Client Integration/Kernel Integration/Clustering Integration/SqlClustering; do
            test -d "$project/bin/Release/net10.0" || { echo "Missing build output for $project" >&2; exit 1; }
          done
          find . -type d -name bin -not -path '*/node_modules/*' -prune -print0 | tar --null -I 'zstd -T0' -cf hot-core-build-output.tar.zst -T -

      - name: Upload hot-core build output
        uses: actions/upload-artifact@v4
        with:
          name: hot-core-build-output
          path: hot-core-build-output.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Export image
        id: export
        run: echo "image=${{ env.HOT_CORE_IMAGE }}" >> "$GITHUB_OUTPUT"

  # Requested PR runs have their own matrix in requested-integration.yml.
  full-out-of-process-matrix:
    needs: [detect, build]
    if: needs.detect.outputs.touched == 'true' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      build-output-artifact: hot-core-build-output
      chronicle-image: ${{ needs.build.outputs.chronicle-image }}
      all-providers: true

  # Keep this ordinary PR check name stable; label events never create a newer skipped check.
  hot-core-gate:
    needs: [detect, build, full-out-of-process-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      # Re-run-failed-jobs reuses detect's outputs and re-evaluates evidence in this job.
      - name: Checkout gate script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DETECT: ${{ needs.detect.result }}
          TOUCHED: ${{ needs.detect.outputs.touched }}
          BUILD: ${{ needs.build.result }}
          MATRIX: ${{ needs.full-out-of-process-matrix.result }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_INTEGRATION: ${{ contains(github.event.pull_request.labels.*.name, 'run-integration') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/evaluate-hot-core-gate.py gate
