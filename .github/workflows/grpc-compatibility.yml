name: gRPC Contract Compatibility

# Scoped to this workflow by name rather than `github.workflow`. In a called
# reusable workflow `github.workflow` resolves to the *caller*, so the generic
# form produced a group identical to the caller's and the two runs contended
# for the same slot.
concurrency:
  group: grpc-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"

  workflow_call:
    inputs:
      base-ref:
        description: 'Base branch reference to compare against'
        required: false
        type: string
        default: 'main'
    outputs:
      has-breaking-changes:
        description: 'Whether breaking changes were detected'
        value: ${{ jobs.check-compatibility.outputs.has-breaking-changes }}
      breaking-changes:
        description: 'List of breaking changes detected'
        value: ${{ jobs.check-compatibility.outputs.breaking-changes }}

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  check-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-breaking-changes: ${{ steps.compare.outputs.has-breaking-changes }}
      breaking-changes: ${{ steps.compare.outputs.breaking-changes }}

    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
        with:
          path: current

      # The `inputs` context is only populated for workflow_call, so on a plain
      # pull_request `inputs.base-ref` was empty and checkout fell back to the
      # triggering ref -- making the baseline identical to the current tree and
      # the comparison below unable to report a breaking change.
      - name: Checkout base code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref || github.event.pull_request.base.ref || 'main' }}
          path: baseline

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate current schema
        working-directory: current
        run: |
          .github/scripts/generate-grpc-schema.sh current-schema.proto

      - name: Generate baseline schema
        run: |
          # Use the script from current (PR) branch to generate schema for baseline code
          current/.github/scripts/generate-grpc-schema.sh baseline/baseline-schema.proto $PWD/baseline

      # A breaking change to the gRPC wire contract FAILS this job. The contract is
      # public API: every deployed client speaks it, so a silent break is a production
      # incident, not a review note.
      #
      # Escape hatch: an intentional breaking change is approved by adding the
      # `grpc-breaking-change-approved` label to the pull request. That label is the
      # deliberate act of accepting wire incompatibility, and it implies the `major`
      # semver label -- a broken public contract is a major release by definition.
      # Labels are read from the event payload, so no token or API call is needed.
      - name: Compare schemas
        id: compare
        working-directory: current
        env:
          APPROVAL_LABEL: grpc-breaking-change-approved
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if .github/scripts/compare-grpc-schemas.sh ../baseline/baseline-schema.proto current-schema.proto > comparison-output.txt 2>&1; then
            cat comparison-output.txt
            echo "has-breaking-changes=false" >> "$GITHUB_OUTPUT"
            echo "breaking-changes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat comparison-output.txt

          CHANGES=$(grep "^  - " comparison-output.txt | sed 's/^  - //' | tr '\n' ';' | sed 's/;$//')
          echo "has-breaking-changes=true" >> "$GITHUB_OUTPUT"
          echo "breaking-changes=$CHANGES" >> "$GITHUB_OUTPUT"

          if printf '%s' "$PR_LABELS" | grep -q "\"${APPROVAL_LABEL}\""; then
            echo "::warning::Breaking gRPC contract changes detected, approved by the '${APPROVAL_LABEL}' label. Make sure the PR also carries the 'major' semver label and documents the migration."
            exit 0
          fi

          echo "::error::Breaking gRPC contract changes detected: ${CHANGES}"
          echo "::error::If this break is intentional, add the '${APPROVAL_LABEL}' label to the pull request (and the 'major' semver label), then re-run this job."
          exit 1

      - name: Upload schemas for reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-schemas
          path: |
            current/current-schema.proto
            baseline/baseline-schema.proto
            current/comparison-output.txt
