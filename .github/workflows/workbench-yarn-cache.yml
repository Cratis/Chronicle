name: Workbench Yarn Cache

# Pull-request workflows only restore caches; they never save them (#5604). This workflow is the one that
# writes the Workbench Yarn package cache, from main, for pull-requests.yml and workbench-build.yml.
# A cache saved on main is readable from every pull request, while one saved by a pull request is
# visible only to that pull request. All three use the shared action with the same package path and key.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "**/yarn.lock"
      - "**/package.json"
      - "Source/Workbench/.yarnrc.yml"
      - ".github/workflows/workbench-yarn-cache.yml"
      # The consumers use the same shared action inputs as this warmer.
      - ".github/workflows/pull-requests.yml"
      - ".github/workflows/workbench-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-yarn-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Caches are immutable per key, so skip the install when main already holds this one.
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@main
        id: yarn-cache
        with:
          working-directory: Source/Workbench
          path: Source/Workbench/.yarn/cache
          mode: save

      - name: Yarn install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        working-directory: ./Source/Workbench
        run: yarn
