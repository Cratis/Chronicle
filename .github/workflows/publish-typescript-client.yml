name: Publish TypeScript Client

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
      protos-artifact:
        description: Name of the artifact containing proto files. Leave empty to generate them.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
        default: '0.0.0'

env:
  DOTNET_VERSION: "11.0.x"
  PROTOC_VERSION: "28.3"

jobs:
  publish-typescript-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected a SemVer version such as 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        if: inputs.protos-artifact == ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: |
          npm install -g npm@11
          NPM_VER="$(npm --version)"
          echo "Installed npm $NPM_VER"
          node -e "
            const v = '$NPM_VER'.split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) {
              console.error('npm >= 11.5.1 is required for trusted publishing, got $NPM_VER');
              process.exit(1);
            }
          "

      - name: Install protoc
        run: |
          PROTOC_ZIP="protoc-${{ env.PROTOC_VERSION }}-linux-x86_64.zip"
          curl -OL "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local 'include/*'
          rm -f "$PROTOC_ZIP"
          protoc --version

      - name: Download proto files
        if: inputs.protos-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.protos-artifact }}
          path: Source/Kernel/Protobuf/

      - name: Build Contracts
        if: inputs.protos-artifact == ''
        working-directory: ./Source/Kernel/Contracts
        run: dotnet build -c Release

      - name: Generate proto files
        if: inputs.protos-artifact == ''
        run: |
          CONTRACTS_DLL="Source/Kernel/Contracts/bin/Release/net11.0/Cratis.Chronicle.Contracts.dll"
          dotnet run \
            --project Source/Tools/ProtoGenerator/ProtoGenerator.csproj -- \
            "$CONTRACTS_DLL" \
            Source/Kernel/Protobuf

      - name: Install TypeScript dependencies
        working-directory: ./Source/Clients/TypeScript
        run: yarn install --ignore-scripts

      - name: Generate TypeScript from proto files
        working-directory: ./Source/Clients/TypeScript
        run: |
          mkdir -p generated
          yarn generate

      - name: Build TypeScript package
        working-directory: ./Source/Clients/TypeScript
        run: yarn build

      - name: Check packed TypeScript consumers
        working-directory: ./Source/Clients/TypeScript
        run: yarn check:consumers

      - name: Set package version
        working-directory: ./Source/Clients/TypeScript
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Check npm for the exact package version
        id: npm-version
        working-directory: ./Source/Clients/TypeScript
        run: node "$GITHUB_WORKSPACE/.github/scripts/npm-version-exists.mjs" .

      # --tag latest is explicit rather than implied. On 2026-08-25 a release accident published 17.0.0, and
      # deleting the tag and the GitHub release put the series back on 16.x without taking the npm version with
      # it - npm versions are immutable and the 72-hour unpublish window closed on 2026-08-28. npm refuses to
      # move "latest" backwards implicitly, so every client publish since has failed with "Cannot implicitly
      # apply the latest tag because previously published version 17.0.0 is higher". Naming the tag is the
      # documented way to say the move is intended, and it is what makes `npm install` resolve to the series
      # this repository actually releases instead of the ghost. See #3842.
      - name: Publish to npm
        if: steps.npm-version.outputs.exists == 'false'
        working-directory: ./Source/Clients/TypeScript
        run: npm publish --provenance --access public --tag latest

  # The Workbench UI package is a second package of the same release. It is not built from protobuf, so it has
  # its own jobs: rerunning them neither rebuilds the contracts nor depends on their publish result.
  #
  # Three jobs on purpose. pack installs the locked Yarn dependencies, packs once and records the tarball's
  # sha256. verify runs the consumer check, which resolves registry peers and executes them, so anything
  # compromised there cannot change what pack produced. publish holds id-token: write, runs nothing but
  # setup-node and npm, and publishes only a tarball whose sha256 equals the one pack recorded.
  pack-chronicle-ui:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected a SemVer version such as 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if [[ "$VERSION" == "0.0.0" ]]; then
            echo "::error::0.0.0 is the manifest placeholder, not a release; refusing to publish @cratis/chronicle-ui as 0.0.0"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install Workbench dependencies
        working-directory: ./Source/Workbench
        run: yarn install --immutable --mode=skip-build

      - name: Build Chronicle UI package
        working-directory: ./Source/Workbench
        run: yarn build:ui

      # Stamp a copy outside the Yarn workspace and pack it once: the private Workbench manifest and its lock stay
      # untouched, and this tarball is the only artifact that is checked and published.
      - name: Pack publishable package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          STAGED="$RUNNER_TEMP/chronicle-ui-package"
          mkdir -p "$STAGED" "$RUNNER_TEMP/chronicle-ui-tarball"
          PACKAGE=Source/Workbench/packages/chronicle-ui
          cp -R "$PACKAGE/dist" "$PACKAGE/package.json" "$PACKAGE/README.md" "$PACKAGE/LICENSE" "$STAGED/"
          cd "$STAGED"
          npm version "$VERSION" --no-git-tag-version
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/chronicle-ui-tarball"

      - name: Record tarball digest
        id: digest
        run: |
          set -e
          cd "$RUNNER_TEMP/chronicle-ui-tarball"
          test "$(ls -1 | wc -l)" -eq 1
          echo "sha256=$(sha256sum cratis-chronicle-ui-*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload packed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronicle-ui-package
          path: ${{ runner.temp }}/chronicle-ui-tarball/cratis-chronicle-ui-*.tgz
          if-no-files-found: error
          retention-days: 1

  verify-chronicle-ui:
    if: github.ref == 'refs/heads/main'
    needs: pack-chronicle-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Download packed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chronicle-ui-package
          path: ${{ runner.temp }}/chronicle-ui-tarball

      - name: Check packed UI consumers
        run: node Source/Workbench/packages/chronicle-ui/check-consumers.mjs "$RUNNER_TEMP"/chronicle-ui-tarball/cratis-chronicle-ui-*.tgz

  publish-chronicle-ui:
    if: github.ref == 'refs/heads/main'
    needs: [pack-chronicle-ui, verify-chronicle-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "::error::Refusing to publish from $REF"; exit 1; }'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      # The npm bundled with the pinned Node line must support trusted publishing; nothing is installed
      # over it, so no floating registry code runs where the OIDC token exists.
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          NPM_VER="$(npm --version)"
          echo "Bundled npm $NPM_VER"
          node -e "
            const v = process.argv[1].split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) {
              console.error('npm >= 11.5.1 is required for trusted publishing, got ' + process.argv[1]);
              process.exit(1);
            }
          " "$NPM_VER"

      - name: Download packed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chronicle-ui-package
          path: ${{ runner.temp }}/chronicle-ui-tarball

      - name: Verify tarball digest
        env:
          EXPECTED: ${{ needs.pack-chronicle-ui.outputs.sha256 }}
        run: |
          set -e
          cd "$RUNNER_TEMP/chronicle-ui-tarball"
          test "$(ls -1 | wc -l)" -eq 1
          ACTUAL="$(sha256sum cratis-chronicle-ui-*.tgz | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tarball digest $ACTUAL does not match the packed digest '$EXPECTED'"
            exit 1
          fi

      - name: Check npm for the exact package version
        id: npm-version
        run: |
          mkdir "$RUNNER_TEMP/chronicle-ui-inspect"
          tar -xzf "$RUNNER_TEMP"/chronicle-ui-tarball/cratis-chronicle-ui-*.tgz -C "$RUNNER_TEMP/chronicle-ui-inspect"
          node "$GITHUB_WORKSPACE/.github/scripts/npm-version-exists.mjs" "$RUNNER_TEMP/chronicle-ui-inspect/package"

      - name: Publish to npm
        if: steps.npm-version.outputs.exists == 'false'
        run: npm publish "$RUNNER_TEMP"/chronicle-ui-tarball/cratis-chronicle-ui-*.tgz --provenance --access public --tag latest
