# Label events must not create newer skipped checks with the names of the ordinary PR build or
# hot-core gate. Even inside this workflow, the label is part of each check name: a later semver
# label cannot mask a failed requested integration run with a skipped check on the same SHA.
# Effective label: the event label on labeled; otherwise run-integration if present, else none.
# This workflow is also called by hot-core-gate.yml on opened/synchronize/reopened of a PR that carries
# run-integration, so those events do not subscribe here (integration would run twice); there github.event
# is the caller's pull_request event and the same expressions apply.
# Repeat that expression in names, conditions and concurrency (env is unavailable in these contexts).
name: Requested Integration

run-name: "Requested Integration${{ format(' - PR #{0} @ {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}"

concurrency:
  # One key for both entry points (label event here, push via hot-core-gate.yml's call), so a push or a
  # relabel cancels stale requested integration whichever entry started it. A literal prefix, not
  # github.workflow (which is the caller's name when called). It differs from the gate caller's key and from
  # dotnet-build.yml's inherited "<workflow>-<ref>", so nothing cancels its own caller.
  group: requested-integration-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled]
    branches:
      - "**"
  workflow_call:
    outputs:
      touched:
        description: Whether the pull request touches the hot core.
        value: ${{ jobs.requested-detect-hot-core.outputs.touched }}
      all_providers:
        description: Whether the requested integration matrix used every storage provider.
        value: ${{ jobs.requested-integration.outputs.all_providers }}
      proven:
        description: "true when the matrix ran and passed, skip when selection reused an earlier pass; empty otherwise."
        value: ${{ jobs.hot-core-gate-requested.outputs.proven }}

jobs:
  requested-integration:
    name: requested-integration-${{ (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') }}
    needs: [requested-detect-hot-core]
    if: (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') == 'run-integration' && github.event.pull_request.head.repo.full_name == github.repository && needs.requested-detect-hot-core.outputs.mode != 'skip'
    # The called build pushes the image consumed by its shards. Pass package write permission
    # and inherit secrets into the called workflow (which forwards them to integration.yml).
    permissions:
      contents: read
      packages: write
      # The nested legacy-contracts job reads owner issue states and the run's TRX artifacts.
      issues: read
      actions: read
    uses: ./.github/workflows/dotnet-build.yml
    secrets: inherit
    with:
      integration_requested: true
      all_providers: ${{ needs.requested-detect-hot-core.outputs.touched == 'true' }}
      integration_selection: ${{ needs.requested-detect-hot-core.outputs.selection }}

  requested-detect-hot-core:
    name: requested-detect-hot-core-${{ (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') }}
    if: (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') == 'run-integration' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads earlier Requested Integration runs of this pull request to reuse a green one.
      actions: read
    outputs:
      touched: ${{ steps.detect.outputs.touched }}
      mode: ${{ steps.select.outputs.mode }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the hot-core contract is intact
        run: python3 .github/scripts/detect-hot-core-changes.py --verify

      - name: Detect hot-core changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_INTEGRATION: "true"
        run: python3 .github/scripts/detect-hot-core-changes.py --base "$BASE_SHA" --head "$HEAD_SHA"

      # Decides how much of the matrix this push needs: nothing (an earlier run of this pull request already
      # passed and only ignorable files changed since), only the lanes the changed paths map to, or everything.
      # Any doubt - hot core, an unmapped path, an unreadable history - means everything.
      - name: Select the integration lanes this push needs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TOUCHED: ${{ steps.detect.outputs.touched }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/test-select-integration.py
          python3 .github/scripts/select-integration.py --base "$BASE_SHA" --head "$HEAD_SHA" --touched "$TOUCHED" \
            --repo "$GITHUB_REPOSITORY" --pull-request "$PR_NUMBER"

  hot-core-gate-requested:
    name: hot-core-gate-requested-${{ (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') }}
    needs: [requested-integration, requested-detect-hot-core]
    # !cancelled(): a run superseded by a push or re-adding the label skips the gate instead of reporting a spurious failure.
    if: ${{ !cancelled() && (github.event.action == 'labeled' && github.event.label.name || contains(github.event.pull_request.labels.*.name, 'run-integration') && 'run-integration' || 'none') == 'run-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Written only on the paths that exit 0, so a caller can trust it without re-deriving the checks.
      proven: ${{ steps.decide.outputs.proven }}
    steps:
      - name: Decide
        id: decide
        env:
          DETECT: ${{ needs.requested-detect-hot-core.result }}
          TOUCHED: ${{ needs.requested-detect-hot-core.outputs.touched }}
          MODE: ${{ needs.requested-detect-hot-core.outputs.mode }}
          INTEGRATION: ${{ needs.requested-integration.result }}
          ALL_PROVIDERS: ${{ needs.requested-integration.outputs.all_providers }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Requested integration for PR head $HEAD_SHA (merge commit $GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"

          if [ "$FORK" = "true" ]; then
            echo "::notice title=Integration unavailable for fork PR::The fork's token cannot push the integration image. Ask a maintainer to run workflow_dispatch on a trusted branch containing these changes."
            echo "Integration was not run for this fork PR. Ask a maintainer to use workflow_dispatch on a trusted branch containing the changes." >> "$GITHUB_STEP_SUMMARY"
            # Fail closed: a fork PR must not satisfy the requested gate without running integration.
            exit 1
          fi

          if [ "$DETECT" != "success" ]; then
            echo "::error::Hot-core detection did not complete ($DETECT). Failing closed."
            exit 1
          fi

          # Selection decided no lane needed to run again: an earlier run of this pull request passed and only
          # files no integration lane exercises changed since (or the whole change is such files). The matrix
          # job is skipped on purpose; the selection step's summary names the evidence.
          if [ "$MODE" = "skip" ] && [ "$INTEGRATION" = "skipped" ]; then
            echo "No integration-relevant file changed since the last passing requested run; its result stands for $HEAD_SHA."
            echo "proven=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$INTEGRATION" != "success" ]; then
            echo "::error::Requested integration did not pass ($INTEGRATION)."
            exit 1
          fi

          # A skipped inner job leaves the reusable workflow result as success; the matrix output proves it ran.
          if [ -z "$ALL_PROVIDERS" ]; then
            echo "::error::The integration matrix did not run for $HEAD_SHA (skipped)."
            exit 1
          fi

          if [ "$TOUCHED" != "true" ]; then
            echo "No hot-core path is touched; the requested PR integration suites passed."
            echo "proven=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ALL_PROVIDERS" != "true" ]; then
            echo "::error::This PR changes the hot core, but the requested integration matrix did not use all storage providers ($ALL_PROVIDERS)."
            exit 1
          fi

          # integration.yml reports reviewed exclusions and skips their jobs explicitly; all other lanes must pass.
          echo "This PR changes the hot core, and the out-of-process matrix passed with any declared lane exclusions reported in discovery's summary."
          echo "proven=true" >> "$GITHUB_OUTPUT"
