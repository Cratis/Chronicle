name: PR Prerelase

concurrency:
  # Serialize updates to one PR rather than cancelling a job while it publishes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  NUGET_SOURCE: https://nuget.pkg.github.com/cratis/index.json
  DOTNET_VERSION: "11.0.x"

on:
  # `edited` is deliberately absent: it fires on every PR title/description
  # edit, which re-ran this whole prerelease pipeline for a text change.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
    paths:
      - "Source/**"
      - ".github/workflows/**"

# Only same-repository PRs enter this pipeline. PR code runs with read-only contents;
# checkout-free jobs publish only the current run's validated artifacts.
permissions: {}

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Release
        id: release
        # This version's PR decision does not create a release in its post step.
        uses: cratis/release-action@26976c4c37ac8c0454077c0f41abb31650e36405 # v1.5.1

  workbench:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Saved on main by workbench-yarn-cache.yml using the same shared action and package path.
      - name: Restore Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@5823f48dfccfd6a2522ffa9035655d43f2aff17b # main
        id: yarn-cache
        with:
          working-directory: Source/Workbench
          path: Source/Workbench/.yarn/cache
          mode: restore

      - name: Yarn install
        working-directory: ./Source/Workbench
        run: yarn

      - name: Build JS/TS
        working-directory: ./Source/Workbench
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn build
          test -s wwwroot/index.html

      # Build outputs are required inputs to later jobs, not best-effort caches.
      - name: Upload Workbench outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: workbench-out
          path: ./Source/Workbench/wwwroot
          if-no-files-found: error

  # Only the DEVELOPMENT-symbol kernel is consumed by the prerelease Docker image.
  # The normal kernel remains covered by the mandatory .NET build workflow.
  kernel-development:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build development variant (DEVELOPMENT symbol)
        working-directory: ./Source/Kernel/Server
        run: |
          dotnet publish -c Debug -p:DefineConstants=DEVELOPMENT -p:DisableProxyGenerator=true -o out/development/x64
          cp -r out/development/x64 out/development/arm64

      - name: Upload development outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: kernel-development-out
          path: ./Source/Kernel/Server/out/development
          if-no-files-found: error

  build-nuget-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release, workbench]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download Workbench outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workbench-out
          path: ./Source/Workbench/wwwroot

      - name: Verify Workbench output
        run: test -s Source/Workbench/wwwroot/index.html

      - name: Setup .Net
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf "$NUGET_OUTPUT"

      - name: Build root
        run: dotnet build --configuration Debug -p:DisableProxyGenerator=true

      - name: Create NuGet packages
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.version }}
        run: dotnet pack --no-build --configuration Debug -o "$NUGET_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify NuGet packages
        env:
          PACKAGE_DIRECTORY: ${{ env.NUGET_OUTPUT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PACKAGE_DIRECTORY"/*.nupkg)
          [ "${#packages[@]}" -gt 0 ]
          for package in "${packages[@]}"; do
            test -s "$package"
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: pr-nuget-packages
          path: ./Artifacts/NuGet/*.nupkg
          if-no-files-found: error

  publish-nuget-packages:
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release, build-nuget-packages]
    permissions:
      packages: write
      pull-requests: write

    steps:
      - name: Setup .Net
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-nuget-packages
          path: ${{ runner.temp }}/pr-nuget-packages

      - name: Verify NuGet packages
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/pr-nuget-packages
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        # Read ZIP/XML as data using the hosted runner's Python standard library.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          import zipfile

          def fail():
              print("::error::Invalid prerelease NuGet package identity or artifact contents.")
              raise SystemExit(1)

          try:
              expected_version = os.environ["EXPECTED_VERSION"]
              if "-" not in expected_version:
                  fail()
              packages = list(Path(os.environ["PACKAGE_DIRECTORY"]).iterdir())
              if not packages:
                  fail()
              suffix = f".{expected_version}.nupkg"
              for package in packages:
                  if package.is_symlink() or not package.is_file() or package.stat().st_size == 0:
                      fail()
                  if not package.name.endswith(suffix):
                      fail()
                  package_id = package.name[:-len(suffix)]
                  if re.fullmatch(r"Cratis\.[A-Za-z0-9.]+", package_id) is None:
                      fail()
                  with zipfile.ZipFile(package) as archive:
                      specs = [entry for entry in archive.infolist() if entry.filename.lower().endswith(".nuspec")]
                      if len(specs) != 1 or "/" in specs[0].filename:
                          fail()
                      document = ET.fromstring(archive.read(specs[0]))
                  if document.tag.split("}")[-1] != "package":
                      fail()
                  metadata, = document.findall("{*}metadata")
                  identity, = metadata.findall("{*}id")
                  version, = metadata.findall("{*}version")
                  if len(identity) or len(version) or identity.text != package_id or version.text != expected_version:
                      fail()
          except (OSError, ValueError, RuntimeError, LookupError, zipfile.BadZipFile, ET.ParseError):
              fail()
          PY

      # No checkout: start with a new config rather than discovering repository NuGet settings.
      - name: Add GitHub Package Registry to NuGet
        env:
          NUGET_CONFIG: ${{ runner.temp }}/pr-nuget.config
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$NUGET_CONFIG" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /></packageSources></configuration>
          EOF
          dotnet nuget add source "$NUGET_SOURCE" --name github --username cratis --password "$NUGET_TOKEN" --store-password-in-clear-text --configfile "$NUGET_CONFIG"

      - name: Push NuGet packages
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/pr-nuget-packages
          NUGET_CONFIG: ${{ runner.temp }}/pr-nuget.config
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "$PACKAGE_DIRECTORY/*.nupkg" --skip-duplicate --timeout 900 --api-key "$NUGET_TOKEN" --source "$NUGET_SOURCE" --configfile "$NUGET_CONFIG"

      - name: Remove NuGet credentials
        if: always()
        env:
          NUGET_CONFIG: ${{ runner.temp }}/pr-nuget.config
        run: rm -f "$NUGET_CONFIG"

      - name: Add comment for NuGet packages
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message: |
            NuGet packages for this PR, e.g. Chronicle:
            https://github.com/Cratis/Chronicle/pkgs/nuget/Cratis.Chronicle

            Use version: ${{ needs.release.outputs.version }}

  build-docker:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release, workbench, kernel-development]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download Workbench outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workbench-out
          path: ./Source/Workbench/wwwroot

      # The artifact already contains x64/ and arm64/. Docker/copy-server-files.sh
      # consumes out/<architecture>, so download directly without flattening or deleting it.
      - name: Download development outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-development-out
          path: Source/Kernel/Server/out

      - name: Verify development and Workbench outputs
        run: |
          set -euo pipefail
          for file in \
            Source/Workbench/wwwroot/index.html \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server.dll \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server.deps.json \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server.runtimeconfig.json; do
            if [ ! -s "$file" ]; then
              echo "::error::Required prerelease output is missing or empty: $file"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Development Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Docker/Development/Dockerfile
          # amd64 only for PR prereleases. arm64 has to be emulated through
          # QEMU on GitHub-hosted runners, which dominated this job's runtime;
          # the release build in publish.yml still ships both architectures.
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/pr-docker-image.tar
          tags: |
            ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            ENTRYPOINT=pr_entrypoint.sh

      - name: Verify Docker archive
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/pr-docker-image.tar
        run: test -s "$IMAGE_ARCHIVE"

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: pr-docker-image
          path: ${{ runner.temp }}/pr-docker-image.tar
          if-no-files-found: error

  publish-docker:
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release, build-docker]
    permissions:
      packages: write
      pull-requests: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-docker-image
          path: ${{ runner.temp }}/pr-docker-image

      - name: Load and verify Docker image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/pr-docker-image/pr-docker-image.tar
          IMAGE_TAG: ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test -s "$IMAGE_ARCHIVE"
          docker load --input "$IMAGE_ARCHIVE"
          test -n "$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        env:
          IMAGE_TAG: ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}
        run: docker push "$IMAGE_TAG"

      - name: Add comment for Docker image
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message: |
            Docker Image for this PR:
            https://ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}

            docker run ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}
