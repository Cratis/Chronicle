name: PR Prerelase

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  NUGET_SOURCE: https://nuget.pkg.github.com/cratis/index.json
  DOTNET8_VERSION: "8.0.410"
  DOTNET9_VERSION: "9.0.x"
  DOTNET_VERSION: "10.0.x"

on:
  # `edited` is deliberately absent: it fires on every PR title/description
  # edit, which re-ran this whole prerelease pipeline for a text change.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
    paths:
      - "Source/**"
      - ".github/workflows/**"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1

  workbench:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
            **/.eslintcache
            **/yarn.lock
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Yarn install
        working-directory: ./Source/Workbench
        run: yarn

      - name: Build JS/TS
        working-directory: ./Source/Workbench
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn build
          test -s wwwroot/index.html

      # Build outputs are required inputs to later jobs, not best-effort caches.
      - name: Upload Workbench outputs
        uses: actions/upload-artifact@v4
        with:
          name: workbench-out
          path: ./Source/Workbench/wwwroot
          if-no-files-found: error

  # Only the DEVELOPMENT-symbol kernel is consumed by the prerelease Docker image.
  # The normal kernel remains covered by the mandatory .NET build workflow.
  kernel-development:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text ${{ env.NUGET_SOURCE }}

      - name: Build development variant (DEVELOPMENT symbol)
        working-directory: ./Source/Kernel/Server
        run: |
          dotnet publish -c Debug -p:DefineConstants=DEVELOPMENT -o out/development/x64
          cp -r out/development/x64 out/development/arm64

      - name: Upload development outputs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-development-out
          path: ./Source/Kernel/Server/out/development
          if-no-files-found: error

  publish-nuget-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release, workbench]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Workbench outputs
        uses: actions/download-artifact@v4
        with:
          name: workbench-out
          path: ./Source/Workbench/wwwroot

      - name: Verify Workbench output
        run: test -s Source/Workbench/wwwroot/index.html

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Add GitHub Package Registry to NuGet
        run: |
          dotnet nuget update source github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text || \
          dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text ${{ env.NUGET_SOURCE }}

      - name: Build root
        run: dotnet build --configuration Debug

      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration Debug -o ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}

      - name: Push NuGet packages
        run: dotnet nuget push '${{ env.NUGET_OUTPUT }}/*.nupkg' --skip-duplicate --timeout 900 --api-key ${{ secrets.GITHUB_TOKEN }} --source "github"

      - name: Add comment for NuGet packages
        uses: mshick/add-pr-comment@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          message: |
            NuGet packages for this PR, e.g. Chronicle:
            https://github.com/Cratis/Chronicle/pkgs/nuget/Cratis.Chronicle

            Use version: ${{ needs.release.outputs.version }}
          allow-repeats: false

  publish-docker:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [workbench, kernel-development, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Workbench outputs
        uses: actions/download-artifact@v4
        with:
          name: workbench-out
          path: ./Source/Workbench/wwwroot

      # The artifact already contains x64/ and arm64/. Docker/copy-server-files.sh
      # consumes out/<architecture>, so download directly without flattening or deleting it.
      - name: Download development outputs
        uses: actions/download-artifact@v4
        with:
          name: kernel-development-out
          path: Source/Kernel/Server/out

      - name: Verify development and Workbench outputs
        run: |
          set -euo pipefail
          for file in \
            Source/Workbench/wwwroot/index.html \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server.dll \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server.deps.json \
            Source/Kernel/Server/out/x64/Cratis.Chronicle.Server.runtimeconfig.json; do
            if [ ! -s "$file" ]; then
              echo "::error::Required prerelease output is missing or empty: $file"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Development Docker Image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Docker/Development/Dockerfile
          # amd64 only for PR prereleases. arm64 has to be emulated through
          # QEMU on GitHub-hosted runners, which dominated this job's runtime;
          # the release build in publish.yml still ships both architectures.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            ENTRYPOINT=pr_entrypoint.sh

      - name: Add comment for Docker image
        uses: mshick/add-pr-comment@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          message: |
            Docker Image for this PR:
            https://ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}

            docker run ghcr.io/cratis/chronicle:${{ needs.release.outputs.version }}
          allow-repeats: false
