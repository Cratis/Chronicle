name: Record Failed Specs

on:
  workflow_run:
    workflows: ['.NET Build & Integration']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: failed-specs-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record-failed-specs:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.repository == 'Cratis/Chronicle' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # workflow_run is privileged: execute only trusted default-branch code.
      # Downloaded artifacts are data, never scripts to execute.
      - name: Check out trusted default-branch reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Download failure evidence without merging lanes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: "{coverage-results-*,sql-clustering-*-results}"
          path: failed-spec-input
          merge-multiple: false
      - name: Record failed specs on the nightly tracker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILED_SPEC_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SPEC_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          mkdir -p failed-spec-input
          node .github/scripts/failed-spec-record.mjs --root failed-spec-input --out "${RUNNER_TEMP}/failed-specs.md"
      - name: Upload failed-spec Markdown
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-specs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failed-specs.md
          retention-days: 90
          if-no-files-found: ignore
