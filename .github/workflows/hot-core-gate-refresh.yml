name: Hot Core Gate Refresh
on:
  workflow_run:
    workflows: ["Requested Integration", ".NET Build & Integration"]
    types: [completed]
permissions: {}
concurrency:
  group: hot-core-gate-refresh-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  refresh:
    # Same-repo PR runs only. Requested Integration must have succeeded; other labels cannot supply green
    # evidence. Completed .NET Build & Integration runs refresh either specs verdict, so a gate whose
    # pending wait timed out or returned a waiting notice can report the final result. Failed/cancelled
    # Requested Integration never triggers refresh. The evaluator also refuses refresh while any required
    # Requested Integration/build job is in flight; running gates report for themselves.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.path == '.github/workflows/dotnet-build.yml') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # workflow_run uses the event revision on the default branch for gate tools,
      # while the completed run's head is used only to select evidence.
      - name: Materialise gate tools
        env:
          BASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/gate-tools"
          rm -rf "$tools"
          mkdir -p "$tools"
          git -C "$tools" init
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$tools" fetch --no-tags --depth=1 "$remote" "$BASE_SHA"
          revision="$BASE_SHA"
          required=(.github/scripts/evaluate-hot-core-gate.py .github/scripts/integration_lane_exclusions.py)
          missing_tool() {
            for path in "${required[@]}"; do
              if ! git -C "$tools" cat-file -e "$revision:$path" 2>/dev/null; then
                echo "$path"
                return
              fi
            done
          }
          missing="$(missing_tool)"
          if [ -n "$missing" ]; then
            echo "::notice::Base lacks $missing; checking the default branch."
            git -C "$tools" fetch --no-tags --depth=1 "$remote" "refs/heads/$DEFAULT_BRANCH"
            revision="$(git -C "$tools" rev-parse FETCH_HEAD)"
            missing="$(missing_tool)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Trusted gate tools missing: $missing"
            exit 1
          fi
          git -C "$tools" archive "$revision" .github | tar -x -C "$tools"
          echo "::notice::Gate tools revision: $revision"
          echo "GATE_TOOLS=$tools" >> "$GITHUB_ENV"
      # Confirm on first post-merge use that GITHUB_TOKEN can re-run failed jobs. If it cannot,
      # D3's unimplemented fallback is POST /repos/{repo}/check-runs with checks: write, name
      # hot-core-gate, this head_sha and conclusion success. The GitHub Actions app would own
      # that check too, satisfying the same required context. Do not switch automatically.
      - name: Re-run the hot-core gate for this head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.path }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python3 -I -c 'import runpy, sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_path(sys.argv.pop(1), run_name="__main__")' "$GATE_TOOLS/.github/scripts" "$GATE_TOOLS"/.github/scripts/evaluate-hot-core-gate.py refresh
