name: Hot Core Gate Refresh
on:
  workflow_run:
    workflows: ["Requested Integration", ".NET Build & Integration"]
    types: [completed]
permissions: {}
concurrency:
  group: hot-core-gate-refresh-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  refresh:
    # Same-repo PR runs only. Requested Integration must have succeeded; other labels cannot supply green
    # evidence. Completed .NET Build & Integration runs refresh either specs verdict, so a gate whose
    # pending wait timed out or returned a waiting notice can report the final result. Failed/cancelled
    # Requested Integration never triggers refresh. The evaluator also refuses refresh while any required
    # Requested Integration/build job is in flight; running gates report for themselves.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.path == '.github/workflows/dotnet-build.yml') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # workflow_run uses the event revision on the default branch for gate tools,
      # while the completed run's head is used only to select evidence.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: gate-tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      # Confirm on first post-merge use that GITHUB_TOKEN can re-run failed jobs. If it cannot,
      # D3's unimplemented fallback is POST /repos/{repo}/check-runs with checks: write, name
      # hot-core-gate, this head_sha and conclusion success. The GitHub Actions app would own
      # that check too, satisfying the same required context. Do not switch automatically.
      - name: Re-run the hot-core gate for this head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.path }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python3 -E -s gate-tools/.github/scripts/evaluate-hot-core-gate.py refresh
