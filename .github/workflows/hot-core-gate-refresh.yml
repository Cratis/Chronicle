name: Hot Core Gate Refresh
on:
  workflow_run:
    workflows: ["Requested Integration"]
    types: [completed]
permissions: {}
concurrency:
  group: hot-core-gate-refresh-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  refresh:
    # Same-repo PR runs that succeeded only; other labels cannot supply green evidence.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # SECURITY: workflow_run has a write token. Check out only the default branch (no ref:),
      # never the PR head; nothing from the PR is executed.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # Confirm on first post-merge use that GITHUB_TOKEN can re-run failed jobs. If it cannot,
      # D3's unimplemented fallback is POST /repos/{repo}/check-runs with checks: write, name
      # hot-core-gate, this head_sha and conclusion success. The GitHub Actions app would own
      # that check too, satisfying the same required context. Do not switch automatically.
      - name: Re-run the hot-core gate for this head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python3 .github/scripts/evaluate-hot-core-gate.py refresh
