syntax = "proto3";
package Cratis.Chronicle.Contracts.SequenceQueries;
import "google/protobuf/empty.proto";

message DeleteSequenceQueryFolderRequest {
   string EventStore = 1;
   string Id = 2;
}
message DeleteSequenceQueryRequest {
   string EventStore = 1;
   string Id = 2;
}
message GetSequenceQueriesRequest {
   string EventStore = 1;
   string Owner = 2;
}
message IEnumerable_SequenceQueryDefinition {
   repeated SequenceQueryDefinition items = 1;
}
message IEnumerable_SequenceQueryFolderDefinition {
   repeated SequenceQueryFolderDefinition items = 1;
}
message SaveSequenceQueryFolderRequest {
   string EventStore = 1;
   SequenceQueryFolderDefinition Folder = 2;
}
message SaveSequenceQueryRequest {
   string EventStore = 1;
   SequenceQueryDefinition Query = 2;
}
message SequenceQueryDefinition {
   string Id = 1;
   string Name = 2;
   SequenceQueryScope Scope = 3;
   string Owner = 4;
   string Namespace = 5;
   string EventSequenceId = 6;
   string EventSourceId = 7;
   repeated string EventTypes = 8;
   repeated string Tags = 9;
   SerializableDateTimeOffset OccurredFrom = 10;
   SerializableDateTimeOffset OccurredTo = 11;
   bool Descending = 12;
   string Folder = 13;
   string EventSourceType = 14;
   string EventStreamType = 15;
   string CorrelationId = 16;
   SequenceQuerySortBy SortBy = 17;
}
message SequenceQueryFolderDefinition {
   string Id = 1;
   SequenceQueryScope Scope = 2;
   string Owner = 3;
   string Namespace = 4;
   string Path = 5;
}
enum SequenceQueryScope {
   User = 0;
   Everyone = 1;
}
enum SequenceQuerySortBy {
   SequenceNumber = 0;
   Occurred = 1;
   EventType = 2;
   EventSourceId = 3;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
service SequenceQueries {
   rpc Delete (DeleteSequenceQueryRequest) returns (.google.protobuf.Empty);
   rpc DeleteFolder (DeleteSequenceQueryFolderRequest) returns (.google.protobuf.Empty);
   rpc GetSequenceQueries (GetSequenceQueriesRequest) returns (IEnumerable_SequenceQueryDefinition);
   rpc GetSequenceQueryFolders (GetSequenceQueriesRequest) returns (IEnumerable_SequenceQueryFolderDefinition);
   rpc ObserveSequenceQueries (GetSequenceQueriesRequest) returns (stream IEnumerable_SequenceQueryDefinition);
   rpc Save (SaveSequenceQueryRequest) returns (.google.protobuf.Empty);
   rpc SaveFolder (SaveSequenceQueryFolderRequest) returns (.google.protobuf.Empty);
}
