syntax = "proto3";
package Cratis.Chronicle.Contracts.Jobs;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllJobsRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message DateTimeOffset {
}
message DeleteJobRequest {
   string EventStore = 1;
   string Namespace = 2;
   .bcl.Guid JobId = 3; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message GetJobStepsRequest {
   string EventStore = 1;
   string Namespace = 2;
   .bcl.Guid JobId = 3; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message JobProgress {
   int32 TotalSteps = 1;
   int32 SuccessfulSteps = 2;
   int32 FailedSteps = 3;
   int32 StoppedSteps = 4;
   bool IsCompleted = 5;
   bool IsStopped = 6;
   string Message = 7;
}
enum JobStatus {
   None = 0;
   PreparingJob = 1;
   PreparingSteps = 2;
   StartingSteps = 3;
   JOB_STATUS_Running = 4;
   JOB_STATUS_CompletedSuccessfully = 5;
   CompletedWithFailures = 6;
   JOB_STATUS_Stopped = 7;
   JOB_STATUS_Failed = 8;
   JOB_STATUS_Removing = 9;
}
message JobStatusChanged {
   JobStatus Status = 1;
   SerializableDateTimeOffset Occurred = 2;
   repeated string ExceptionMessages = 3;
   string ExceptionStackTrace = 4;
}
message JobStepProgress {
   int32 Percentage = 1;
   string Message = 2;
}
enum JobStepStatus {
   JOB_STEP_STATUS_Unknown = 0;
   Scheduled = 1;
   JOB_STEP_STATUS_Running = 2;
   JOB_STEP_STATUS_CompletedSuccessfully = 3;
   CompletedWithFailure = 4;
   JOB_STEP_STATUS_Stopped = 5;
   JOB_STEP_STATUS_Failed = 6;
   JOB_STEP_STATUS_Removing = 7;
}
message JobStepStatusChanged {
   JobStepStatus Status = 1;
   SerializableDateTimeOffset Occurred = 2;
   repeated string ExceptionMessages = 3;
   string ExceptionStackTrace = 4;
}
message JobStepSummaryResponse {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Type = 2;
   string Name = 3;
   JobStepStatus Status = 4;
   repeated JobStepStatusChanged StatusChanges = 5;
   JobStepProgress Progress = 6;
}
message JobSummaryResponse {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Details = 2;
   string Type = 3;
   JobStatus Status = 4;
   DateTimeOffset Created = 5;
   repeated JobStatusChanged StatusChanges = 6;
   JobProgress Progress = 7;
}
message ObserveJobsRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message QueryResult_IEnumerable_JobStepSummaryResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated JobStepSummaryResponse Data = 6;
}
message QueryResult_IEnumerable_JobSummaryResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated JobSummaryResponse Data = 6;
}
message ResumeJobRequest {
   string EventStore = 1;
   string Namespace = 2;
   .bcl.Guid JobId = 3; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message StopJobRequest {
   string EventStore = 1;
   string Namespace = 2;
   .bcl.Guid JobId = 3; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   VALIDATION_RESULT_SEVERITY_Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Jobs {
   rpc AllJobs (AllJobsRequest) returns (QueryResult_IEnumerable_JobSummaryResponse);
   rpc DeleteJob (DeleteJobRequest) returns (CommandResult);
   rpc GetJobSteps (GetJobStepsRequest) returns (QueryResult_IEnumerable_JobStepSummaryResponse);
   rpc ObserveJobs (ObserveJobsRequest) returns (stream QueryResult_IEnumerable_JobSummaryResponse);
   rpc ResumeJob (ResumeJobRequest) returns (CommandResult);
   rpc StopJob (StopJobRequest) returns (CommandResult);
}
