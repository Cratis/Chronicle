syntax = "proto3";
package Cratis.Chronicle.Contracts.ReadModelLookups;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message FindByCompositeKeyRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ReadModel = 3;
   map<string,string> Parts = 4;
}
message QueryResult_ReadModelLookupResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   ReadModelLookupResponse Data = 6;
}
enum ReadModelLookupOutcome {
   NotFound = 0;
   Found = 1;
   AmbiguousLegacyKey = 2;
   KeyCollision = 3;
   InvalidKey = 4;
   NotSupported = 5;
}
message ReadModelLookupResponse {
   ReadModelLookupOutcome Outcome = 1;
   string ReadModel = 2;
   uint64 LastHandledEventSequenceNumber = 3;
   string Message = 4;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service ReadModelLookups {
   rpc FindByCompositeKey (FindByCompositeKeyRequest) returns (QueryResult_ReadModelLookupResponse);
}
