syntax = "proto3";
package Cratis.Chronicle.Contracts.ProjectionEditor;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message CommandResult_GenerateDeclarativeCodeResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   GenerateDeclarativeCodeResponse Response = 7;
}
message DraftReadModel {
   string Identifier = 1;
   string DisplayName = 2;
   string ContainerName = 3;
   string Schema = 4;
}
message GenerateDeclarativeCodeRequest {
   string EventStore = 1;
   string Namespace = 2;
   string Declaration = 3;
   DraftReadModel DraftReadModel = 4;
   string Language = 5;
}
message GenerateDeclarativeCodeResponse {
   string Code = 1;
   repeated ProjectionDeclarationSyntaxError Errors = 2;
}
message GenerateModelBoundCodeRequest {
   string EventStore = 1;
   string Namespace = 2;
   string Declaration = 3;
   DraftReadModel DraftReadModel = 4;
   string Language = 5;
}
message ProjectionDeclarationSyntaxError {
   string Message = 1;
   int32 Line = 2;
   int32 Column = 3;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service ProjectionEditor {
   rpc GenerateDeclarativeCode (GenerateDeclarativeCodeRequest) returns (CommandResult_GenerateDeclarativeCodeResponse);
   rpc GenerateModelBoundCode (GenerateModelBoundCodeRequest) returns (CommandResult_GenerateDeclarativeCodeResponse);
}
