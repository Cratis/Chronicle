syntax = "proto3";
package Cratis.Chronicle.Contracts.Sequences;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllEventSequencesRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message AppendManyForEventSourcesRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   repeated EventForEventSourceId Events = 4;
   .bcl.Guid CorrelationId = 5;
   repeated string Tags = 6;
   repeated Causation Causation = 7;
   Identity CausedBy = 8;
   repeated EventSourceConcurrencyScope ConcurrencyScopes = 9;
}
message AppendManyRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string EventSourceId = 4;
   repeated EventToAppend Events = 5;
   .bcl.Guid CorrelationId = 6;
   repeated string Tags = 7;
   repeated Causation Causation = 8;
   Identity CausedBy = 9;
   ConcurrencyScope ConcurrencyScope = 10;
}
message AppendManyResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   repeated uint64 SequenceNumbers = 2 [packed = false];
   bool IsSuccess = 3;
   bool HasConstraintViolations = 4;
   bool HasConcurrencyViolations = 5;
   bool HasErrors = 6;
   bool ConcurrencyCheckPerformed = 7;
   repeated ConstraintViolation ConstraintViolations = 8;
   repeated string Errors = 9;
   repeated ConcurrencyViolation ConcurrencyViolations = 10;
}
message AppendRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string EventSourceId = 4;
   string EventSourceType = 5;
   string EventStreamType = 6;
   string EventStreamId = 7;
   EventType EventType = 8;
   map<string,JsonNode> Content = 9;
   .bcl.Guid CorrelationId = 10;
   repeated string Tags = 11;
   SerializableDateTimeOffset Occurred = 12;
   string Subject = 13;
   repeated Causation Causation = 14;
   Identity CausedBy = 15;
   ConcurrencyScope ConcurrencyScope = 16;
}
message AppendResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   uint64 SequenceNumber = 2;
   bool IsSuccess = 3;
   bool HasConstraintViolations = 4;
   bool HasConcurrencyViolations = 5;
   bool HasErrors = 6;
   bool ConcurrencyCheckPerformed = 7;
   repeated ConstraintViolation ConstraintViolations = 8;
   repeated string Errors = 9;
   ConcurrencyViolation ConcurrencyViolation = 10;
}
message Causation {
   SerializableDateTimeOffset Occurred = 1;
   string Type = 2;
   map<string,string> Properties = 3;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message CommandResult_AppendManyResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   AppendManyResponse Response = 7;
}
message CommandResult_AppendResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   AppendResponse Response = 7;
}
message CommandResult_UInt64 {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   uint64 Response = 7;
}
message CompleteStreamRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string EventStreamType = 4;
   string EventStreamId = 5;
}
message ConcurrencyScope {
   uint64 SequenceNumber = 1;
   bool EventSourceId = 2;
   string EventStreamType = 3;
   string EventStreamId = 4;
   string EventSourceType = 5;
   repeated EventType EventTypes = 6;
   bool ExpectsNoMatchingEvent = 7;
}
message ConcurrencyViolation {
   string EventSourceId = 1;
   uint64 ExpectedSequenceNumber = 2;
   uint64 ActualSequenceNumber = 3;
}
enum ConstraintType {
   CONSTRAINT_TYPE_Unknown = 0;
   Unique = 1;
   UniqueEventType = 2;
   Schema = 3;
   StreamClosed = 4;
}
message ConstraintViolation {
   string EventTypeId = 1;
   uint64 SequenceNumber = 2;
   ConstraintType ConstraintType = 3;
   string ConstraintName = 4;
   string Message = 5;
   map<string,string> Details = 6;
}
message EndOfRequest {
   SerializableDateTimeOffset Start = 1;
   HistogramResolution Resolution = 2;
}
message EventForEventSourceId {
   string EventSourceId = 1;
   string EventSourceType = 2;
   string EventStreamType = 3;
   string EventStreamId = 4;
   EventType EventType = 5;
   map<string,JsonNode> Content = 6;
   repeated string Tags = 7;
   SerializableDateTimeOffset Occurred = 8;
   string Subject = 9;
}
message EventSequenceNamesResponse {
   string Id = 1;
   string Name = 2;
}
message EventSourceConcurrencyScope {
   string EventSourceId = 1;
   ConcurrencyScope Scope = 2;
}
message EventToAppend {
   EventType EventType = 1;
   map<string,JsonNode> Content = 2;
   string Subject = 3;
}
message EventType {
   string Id = 1;
   uint32 Generation = 2;
   bool Tombstone = 3;
}
message HasEventsForEventSourceIdRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string EventSourceId = 4;
}
enum HistogramResolution {
   Minute = 0;
   Hour = 1;
   Day = 2;
   Week = 3;
   Month = 4;
}
message Identity {
   string Subject = 1;
   string Name = 2;
   string UserName = 3;
   Identity OnBehalfOf = 4;
}
message JsonNode {
}
message ParseResolutionRequest {
   string Resolution = 1;
}
message QueryResult_Boolean {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   bool Data = 6;
}
message QueryResult_HistogramResolution {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   HistogramResolution Data = 6;
}
message QueryResult_IEnumerable_EventSequenceNamesResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated EventSequenceNamesResponse Data = 6;
}
message QueryResult_IEnumerable_SequenceHistogramBucketResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated SequenceHistogramBucketResponse Data = 6;
}
message QueryResult_SerializableDateTimeOffset {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   SerializableDateTimeOffset Data = 6;
}
message QueryResult_UInt64 {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   uint64 Data = 6;
}
message RedactForEventSourceRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string EventSourceId = 4;
   string Reason = 5;
   repeated string EventTypes = 6;
   repeated Causation Causation = 7;
   Identity CausedBy = 8;
}
message RedactRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   uint64 SequenceNumber = 4;
   string Reason = 5;
   repeated Causation Causation = 6;
   Identity CausedBy = 7;
}
message ReviseRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   uint64 SequenceNumber = 4;
   EventType EventType = 5;
   map<string,JsonNode> Content = 6;
   repeated Causation Causation = 7;
   Identity CausedBy = 8;
}
message SequenceHistogramBucketResponse {
   SerializableDateTimeOffset From = 1;
   SerializableDateTimeOffset To = 2;
   int64 Count = 3;
}
message SequenceHistogramRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string Resolution = 4;
   string EventSourceId = 5;
   string EventSourceType = 6;
   string EventStreamType = 7;
   string CorrelationId = 8;
   string EventTypeIds = 9;
   string Tags = 10;
   SerializableDateTimeOffset OccurredFrom = 11;
   SerializableDateTimeOffset OccurredTo = 12;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message TailSequenceNumberRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   string EventTypeIds = 4;
   string EventSourceId = 5;
   string EventSourceType = 6;
   string EventStreamId = 7;
   string EventStreamType = 8;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   VALIDATION_RESULT_SEVERITY_Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service EventSequences {
   rpc AllEventSequences (AllEventSequencesRequest) returns (QueryResult_IEnumerable_EventSequenceNamesResponse);
   rpc Append (AppendRequest) returns (CommandResult_AppendResponse);
   rpc AppendMany (AppendManyRequest) returns (CommandResult_AppendManyResponse);
   rpc AppendManyForEventSources (AppendManyForEventSourcesRequest) returns (CommandResult_AppendManyResponse);
   rpc CompleteStream (CompleteStreamRequest) returns (CommandResult_UInt64);
   rpc EndOf (EndOfRequest) returns (QueryResult_SerializableDateTimeOffset);
   rpc HasEventsForEventSourceId (HasEventsForEventSourceIdRequest) returns (QueryResult_Boolean);
   rpc ParseResolution (ParseResolutionRequest) returns (QueryResult_HistogramResolution);
   rpc Redact (RedactRequest) returns (CommandResult);
   rpc RedactForEventSource (RedactForEventSourceRequest) returns (CommandResult);
   rpc Revise (ReviseRequest) returns (CommandResult);
   rpc SequenceHistogram (SequenceHistogramRequest) returns (QueryResult_IEnumerable_SequenceHistogramBucketResponse);
   rpc TailSequenceNumber (TailSequenceNumberRequest) returns (QueryResult_UInt64);
}
