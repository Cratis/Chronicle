syntax = "proto3";
package Cratis.Chronicle.Contracts.Events.Constraints.Operator;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message CommandResult_Guid {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   .bcl.Guid Response = 7; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message ReindexConstraintsRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSequenceId = 3;
   repeated string ConstraintNames = 4;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service ConstraintIndexes {
   rpc ReindexConstraints (ReindexConstraintsRequest) returns (CommandResult_Guid);
}
