syntax = "proto3";
package Cratis.Chronicle.Contracts.Seeding;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AddSeedEntryRequest {
   string EventStore = 1;
   string Namespace = 2;
   string EventSourceId = 3;
   string EventTypeId = 4;
   string Content = 5;
   bool IsGlobal = 6;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message EventSourceSeedEntries {
   string EventSourceId = 1;
   repeated SeedingEntry Entries = 2;
}
message EventTypeSeedEntries {
   string EventTypeId = 1;
   repeated SeedingEntry Entries = 2;
}
message GetGlobalSeedDataRequest {
   string EventStore = 1;
}
message GetNamespaceSeedDataRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message NamespacedSeedEntries {
   string Namespace = 1;
   repeated EventTypeSeedEntries ByEventType = 2;
   repeated EventSourceSeedEntries ByEventSource = 3;
}
message QueryResult_SeedDataResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   SeedDataResponse Data = 6;
}
message SeedDataResponse {
   repeated EventTypeSeedEntries ByEventType = 1;
   repeated EventSourceSeedEntries ByEventSource = 2;
}
message SeedEventsRequest {
   string EventStore = 1;
   repeated EventTypeSeedEntries GlobalByEventType = 2;
   repeated EventSourceSeedEntries GlobalByEventSource = 3;
   repeated NamespacedSeedEntries NamespacedEntries = 4;
}
message SeedingEntry {
   string EventSourceId = 1;
   string EventTypeId = 2;
   string Content = 3;
   repeated string Tags = 4;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service EventSeeding {
   rpc AddSeedEntry (AddSeedEntryRequest) returns (CommandResult);
   rpc GetGlobalSeedData (GetGlobalSeedDataRequest) returns (QueryResult_SeedDataResponse);
   rpc GetNamespaceSeedData (GetNamespaceSeedDataRequest) returns (QueryResult_SeedDataResponse);
   rpc SeedEvents (SeedEventsRequest) returns (CommandResult);
}
