syntax = "proto3";
package Cratis.Chronicle.Contracts.ReadModelExplorer;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllSnapshotsForReadModelRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ReadModel = 3;
   string ReadModelKey = 4;
   string EventSequenceId = 5;
   string Grouping = 6;
}
message Causation {
   SerializableDateTimeOffset Occurred = 1;
   string Type = 2;
   map<string,string> Properties = 3;
}
message Event {
   EventContext Context = 1;
   string Content = 2;
}
message EventContext {
   EventType EventType = 1;
   string EventSourceType = 2;
   string EventSourceId = 3;
   uint64 SequenceNumber = 4;
   string EventStreamType = 5;
   string EventStreamId = 6;
   SerializableDateTimeOffset Occurred = 7;
   .bcl.Guid CorrelationId = 8; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   repeated Causation Causation = 9;
   Identity CausedBy = 10;
   repeated string Tags = 11;
   string Hash = 12;
   EventObservationState ObservationState = 13;
}
enum EventObservationState {
   None = 0;
   Initial = 1;
   Replay = 2;
}
message EventType {
   string Id = 1;
   uint32 Generation = 2;
   bool Tombstone = 3;
}
message Identity {
   string Subject = 1;
   string Name = 2;
   string UserName = 3;
   Identity OnBehalfOf = 4;
}
message QueryResult_IEnumerable_ReadModelSnapshotResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated ReadModelSnapshotResponse Data = 6;
}
message ReadModelSnapshotResponse {
   SerializableDateTimeOffset Occurred = 1;
   .bcl.Guid CorrelationId = 2; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Instance = 3;
   repeated Event Events = 4;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service ReadModelExplorer {
   rpc AllSnapshotsForReadModel (AllSnapshotsForReadModelRequest) returns (QueryResult_IEnumerable_ReadModelSnapshotResponse);
}
