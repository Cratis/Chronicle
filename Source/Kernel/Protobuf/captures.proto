syntax = "proto3";
package Cratis.Chronicle.Contracts.Captures;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message CaptureDetailsResponse {
   string Id = 1;
   string Name = 2;
   string Declaration = 3;
   CaptureStatus Status = 4;
}
enum CaptureStatus {
   Stopped = 0;
   Started = 1;
}
message CaptureValidationMessage {
   string Message = 1;
   int32 Line = 2;
   int32 Column = 3;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message CommandResult_SaveCaptureResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   SaveCaptureResponse Response = 7;
}
message CommandResult_StartCaptureResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   StartCaptureResponse Response = 7;
}
message CommandResult_ValidateCaptureDeclarationResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   ValidateCaptureDeclarationResponse Response = 7;
}
message DeleteCaptureRequest {
   string EventStore = 1;
   string CaptureId = 2;
}
message GetCapturesRequest {
   string EventStore = 1;
}
message ObserveCapturesRequest {
   string EventStore = 1;
}
message QueryResult_IEnumerable_CaptureDetailsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated CaptureDetailsResponse Data = 6;
}
message SaveCaptureRequest {
   string EventStore = 1;
   string Id = 2;
   string Declaration = 3;
}
message SaveCaptureResponse {
   CaptureDetailsResponse Capture = 1;
   repeated CaptureValidationMessage Messages = 2;
}
message StartCaptureRequest {
   string EventStore = 1;
   string CaptureId = 2;
}
message StartCaptureResponse {
   repeated CaptureValidationMessage Messages = 1;
}
message StopCaptureRequest {
   string EventStore = 1;
   string CaptureId = 2;
}
message ValidateCaptureDeclarationRequest {
   string EventStore = 1;
   string Declaration = 2;
}
message ValidateCaptureDeclarationResponse {
   repeated CaptureValidationMessage Messages = 1;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Captures {
   rpc DeleteCapture (DeleteCaptureRequest) returns (CommandResult);
   rpc GetCaptures (GetCapturesRequest) returns (QueryResult_IEnumerable_CaptureDetailsResponse);
   rpc ObserveCaptures (ObserveCapturesRequest) returns (stream QueryResult_IEnumerable_CaptureDetailsResponse);
   rpc SaveCapture (SaveCaptureRequest) returns (CommandResult_SaveCaptureResponse);
   rpc StartCapture (StartCaptureRequest) returns (CommandResult_StartCaptureResponse);
   rpc StopCapture (StopCaptureRequest) returns (CommandResult);
   rpc ValidateCaptureDeclaration (ValidateCaptureDeclarationRequest) returns (CommandResult_ValidateCaptureDeclarationResponse);
}
