syntax = "proto3";
package Cratis.Chronicle.Contracts.Alerts;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AlertEvidence {
   int32 AttemptCount = 1;
   SerializableDateTimeOffset FirstFailure = 2;
   SerializableDateTimeOffset LastFailure = 3;
   FailureKind FailureKind = 4;
   string Message = 5;
}
message AlertIncidentContinuation {
   uint64 RaisedSequenceNumber = 1;
   .bcl.Guid IncidentId = 2; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message AlertIncidentCountDetails {
   string Namespace = 1;
   string Condition = 2;
   AlertSeverity Severity = 3;
   int64 Count = 4;
}
message AlertIncidentDetails {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   AlertTarget Target = 2;
   string Condition = 3;
   AlertSeverity Severity = 4;
   AlertEvidence Evidence = 5;
   SerializableDateTimeOffset RaisedAt = 6;
   SerializableDateTimeOffset LastChangedAt = 7;
   uint64 RaisedSequenceNumber = 8;
   uint64 LastTransitionSequenceNumber = 9;
}
message AlertIncidentLookupResponse {
   AlertIncidentsReadinessState Status = 1;
   AlertIncidentDetails Incident = 2;
}
message AlertIncidentPageResponse {
   AlertIncidentsReadinessState Status = 1;
   repeated AlertIncidentDetails Items = 2;
   AlertIncidentContinuation Next = 3;
}
message AlertIncidentSummaryResponse {
   AlertIncidentsReadinessState Status = 1;
   repeated AlertIncidentCountDetails Counts = 2;
}
enum AlertIncidentsReadinessState {
   CatchingUp = 0;
   Ready = 1;
   Degraded = 2;
}
enum AlertSeverity {
   ALERT_SEVERITY_Warning = 0;
   Critical = 1;
}
message AlertTarget {
   string EventStore = 1;
   string Namespace = 2;
   string ObserverId = 3;
   string EventSequenceId = 4;
   string Partition = 5;
}
enum FailureKind {
   FAILURE_KIND_Unknown = 0;
   Handling = 1;
   Timeout = 2;
   Disconnected = 3;
}
message GetOpenIncidentCountsRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message GetOpenIncidentRequest {
   string EventStore = 1;
   .bcl.Guid IncidentId = 2; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Namespace = 3;
}
message GetOpenIncidentsRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ObserverId = 3;
   string Condition = 4;
   AlertSeverity MinimumSeverity = 5;
   int32 Limit = 6;
   uint64 AfterRaisedSequenceNumber = 7;
   .bcl.Guid AfterIncidentId = 8;
}
message QueryResult_AlertIncidentLookupResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   AlertIncidentLookupResponse Data = 6;
}
message QueryResult_AlertIncidentPageResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   AlertIncidentPageResponse Data = 6;
}
message QueryResult_AlertIncidentSummaryResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   AlertIncidentSummaryResponse Data = 6;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   VALIDATION_RESULT_SEVERITY_Unknown = 0;
   Information = 1;
   VALIDATION_RESULT_SEVERITY_Warning = 2;
   Error = 3;
}
service Alerts {
   rpc GetOpenIncident (GetOpenIncidentRequest) returns (QueryResult_AlertIncidentLookupResponse);
   rpc GetOpenIncidentCounts (GetOpenIncidentCountsRequest) returns (QueryResult_AlertIncidentSummaryResponse);
   rpc GetOpenIncidents (GetOpenIncidentsRequest) returns (QueryResult_AlertIncidentPageResponse);
}
