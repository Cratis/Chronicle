syntax = "proto3";
package Cratis.Chronicle.Contracts.Observation.Webhooks;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AddWebhookRequest {
   string EventStore = 1;
   string Name = 2;
   string Url = 3;
   string EventSequenceId = 4;
   repeated EventType EventTypes = 5;
   AuthorizationType AuthorizationType = 6;
   string BasicUsername = 7;
   string BasicPassword = 8;
   string BearerToken = 9;
   string OAuthAuthority = 10;
   string OAuthClientId = 11;
   string OAuthClientSecret = 12;
   map<string,string> Headers = 13;
   bool IsReplayable = 14;
   bool IsActive = 15;
}
message AddWebhooksRequest {
   string EventStore = 1;
   repeated WebhookDefinition Webhooks = 2;
}
enum AuthorizationType {
   None = 0;
   Basic = 1;
   Bearer = 2;
   OAuth = 3;
}
message BasicAuthorization {
   string Username = 1;
   string Password = 2;
}
message BearerTokenAuthorization {
   string Token = 1;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message EventType {
   string Id = 1;
   uint32 Generation = 2;
   bool Tombstone = 3;
}
message GetWebhooksRequest {
   string EventStore = 1;
}
message OAuthAuthorization {
   string Authority = 1;
   string ClientId = 2;
   string ClientSecret = 3;
}
message ObserveWebhooksRequest {
   string EventStore = 1;
}
message OneOf_BasicAuthorization_BearerTokenAuthorization_OAuthAuthorization {
   BasicAuthorization Value0 = 1;
   BearerTokenAuthorization Value1 = 2;
   OAuthAuthorization Value2 = 3;
}
message QueryResult_IEnumerable_WebhookDetailsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated WebhookDetailsResponse Data = 6;
}
message RemoveWebhookRequest {
   string EventStore = 1;
   string WebhookId = 2;
}
message RemoveWebhooksRequest {
   string EventStore = 1;
   repeated string Webhooks = 2;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
message WebhookDefinition {
   string EventSequenceId = 1;
   string Identifier = 2;
   repeated EventType EventTypes = 3;
   WebhookTarget Target = 4;
   bool IsReplayable = 5; // default value could not be applied: True
   bool IsActive = 6; // default value could not be applied: True
}
message WebhookDetailsResponse {
   string Identifier = 1;
   string Url = 2;
   string EventSequenceId = 3;
   repeated EventType EventTypes = 4;
   AuthorizationType AuthorizationType = 5;
   map<string,string> Headers = 6;
   bool IsReplayable = 7;
   bool IsActive = 8;
}
message WebhookTarget {
   string Url = 1;
   OneOf_BasicAuthorization_BearerTokenAuthorization_OAuthAuthorization Authorization = 2;
   map<string,string> Headers = 3;
}
service Webhooks {
   rpc AddWebhook (AddWebhookRequest) returns (CommandResult);
   rpc AddWebhooks (AddWebhooksRequest) returns (CommandResult);
   rpc GetWebhooks (GetWebhooksRequest) returns (QueryResult_IEnumerable_WebhookDetailsResponse);
   rpc ObserveWebhooks (ObserveWebhooksRequest) returns (stream QueryResult_IEnumerable_WebhookDetailsResponse);
   rpc RemoveWebhook (RemoveWebhookRequest) returns (CommandResult);
   rpc RemoveWebhooks (RemoveWebhooksRequest) returns (CommandResult);
}
