syntax = "proto3";
package Cratis.Chronicle.Contracts.Security;
import "google/protobuf/empty.proto";
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AddApplicationRequest {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string ClientId = 2;
   string ClientSecret = 3;
}
message AddUserRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Username = 2;
   string Email = 3;
   string Password = 4;
}
message AdminPasswordStatusResponse {
   bool IsRequired = 1;
   .bcl.Guid AdminUserId = 2;
   string AdminUsername = 3;
}
message AdministratorResponse {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Username = 2;
}
message ApplicationResponse {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string ClientId = 2;
   bool IsActive = 3;
   SerializableDateTimeOffset CreatedAt = 4;
   SerializableDateTimeOffset LastModifiedAt = 5;
}
message ChangeApplicationSecretRequest {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string ClientSecret = 2;
}
message ChangeUserPasswordRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string OldPassword = 2;
   string Password = 3;
   string ConfirmedPassword = 4;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message CommandResult_Boolean {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   bool Response = 7;
}
enum EventStoreAccessGrantSource {
   Configuration = 0;
   Command = 1;
}
message EventStoreAccessGrantsResponse {
   string EventStore = 4;
   string Namespace = 5;
   StoreAccess Access = 6;
   EventStoreAccessGrantSource Source = 7;
   EventStoreAccessHolder Holder = 8;
}
message EventStoreAccessHolder {
   string Issuer = 1;
   string Subject = 2;
   bool IsClient = 3;
}
message EventStoreAccessPreflightResponse {
   string EventStore = 4;
   string Namespace = 5;
   StoreAccess Access = 6;
   SerializableDateTimeOffset FirstSeen = 7;
   SerializableDateTimeOffset LastSeen = 8;
   int64 Count = 9;
   EventStoreAccessHolder Holder = 10;
}
message GrantAdministratorRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message GrantEventStoreAccessRequest {
   string EventStore = 4;
   string Namespace = 5;
   StoreAccess Access = 6;
   EventStoreAccessHolder Holder = 7;
   bool AllEventStores = 8;
}
message QueryResult_AdminPasswordStatusResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   AdminPasswordStatusResponse Data = 6;
}
message QueryResult_IEnumerable_AdministratorResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated AdministratorResponse Data = 6;
}
message QueryResult_IEnumerable_ApplicationResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated ApplicationResponse Data = 6;
}
message QueryResult_IEnumerable_EventStoreAccessGrantsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated EventStoreAccessGrantsResponse Data = 6;
}
message QueryResult_IEnumerable_EventStoreAccessPreflightResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated EventStoreAccessPreflightResponse Data = 6;
}
message QueryResult_IEnumerable_UserResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated UserResponse Data = 6;
}
message RemoveApplicationRequest {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message RemoveUserRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message RequirePasswordChangeRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message RevokeAdministratorRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Reason = 2;
}
message RevokeEventStoreAccessRequest {
   string EventStore = 4;
   string Namespace = 5;
   EventStoreAccessHolder Holder = 6;
   bool AllEventStores = 7;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message SetInitialAdminPasswordRequest {
   .bcl.Guid UserId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Password = 2;
   string ConfirmedPassword = 3;
   string SetupToken = 4;
}
enum StoreAccess {
   None = 0;
   Read = 1;
   Append = 2;
   Manage = 4;
}
message UserResponse {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Username = 2;
   string Email = 3;
   bool IsActive = 4;
   SerializableDateTimeOffset CreatedAt = 5;
   SerializableDateTimeOffset LastModifiedAt = 6;
   bool HasLoggedIn = 7;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Administrators {
   rpc All (.google.protobuf.Empty) returns (QueryResult_IEnumerable_EventStoreAccessGrantsResponse);
   rpc AllAdministrators (.google.protobuf.Empty) returns (QueryResult_IEnumerable_AdministratorResponse);
   rpc GrantAdministrator (GrantAdministratorRequest) returns (CommandResult);
   rpc GrantEventStoreAccess (GrantEventStoreAccessRequest) returns (CommandResult);
   rpc RevokeAdministrator (RevokeAdministratorRequest) returns (CommandResult);
   rpc RevokeEventStoreAccess (RevokeEventStoreAccessRequest) returns (CommandResult_Boolean);
   rpc Uncovered (.google.protobuf.Empty) returns (QueryResult_IEnumerable_EventStoreAccessPreflightResponse);
}
service Applications {
   rpc AddApplication (AddApplicationRequest) returns (CommandResult);
   rpc AllApplications (.google.protobuf.Empty) returns (stream QueryResult_IEnumerable_ApplicationResponse);
   rpc ChangeApplicationSecret (ChangeApplicationSecretRequest) returns (CommandResult);
   rpc RemoveApplication (RemoveApplicationRequest) returns (CommandResult);
}
service Users {
   rpc AddUser (AddUserRequest) returns (CommandResult);
   rpc AllUsers (.google.protobuf.Empty) returns (stream QueryResult_IEnumerable_UserResponse);
   rpc ChangeUserPassword (ChangeUserPasswordRequest) returns (CommandResult);
   rpc GetStatus (.google.protobuf.Empty) returns (QueryResult_AdminPasswordStatusResponse);
   rpc RemoveUser (RemoveUserRequest) returns (CommandResult);
   rpc RequirePasswordChange (RequirePasswordChangeRequest) returns (CommandResult);
   rpc SetInitialAdminPassword (SetInitialAdminPasswordRequest) returns (CommandResult);
}
