syntax = "proto3";
package Cratis.Chronicle.Contracts.Patterns;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllPatternScopesRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message AllPatternsRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message BehaviorPatternDetailsResponse {
   string Id = 1;
   string GroupingKey = 2;
   map<string,string> Facets = 3;
   double Confidence = 4;
   double Support = 5;
   int64 Occurrences = 6;
   double Weight = 7;
   int32 Specificity = 8;
   SerializableDateTimeOffset FirstSeen = 9;
   SerializableDateTimeOffset LastSeen = 10;
}
message MatchingPatternsRequest {
   string EventStore = 1;
   string Namespace = 2;
   string GroupingKey = 3;
   map<string,string> Context = 4;
   double MinimumConfidence = 5;
   int32 MaximumResults = 6;
}
message PatternScopeResponse {
   string Id = 1;
}
message PatternsForScopeRequest {
   string EventStore = 1;
   string Namespace = 2;
   string GroupingKey = 3;
}
message QueryResult_IEnumerable_BehaviorPatternDetailsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated BehaviorPatternDetailsResponse Data = 6;
}
message QueryResult_IEnumerable_PatternScopeResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated PatternScopeResponse Data = 6;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message UsualActionsRequest {
   string EventStore = 1;
   string Namespace = 2;
   string GroupingKey = 3;
   map<string,string> Context = 4;
   double MinimumConfidence = 5;
   int32 MaximumResults = 6;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Patterns {
   rpc AllPatterns (AllPatternsRequest) returns (QueryResult_IEnumerable_BehaviorPatternDetailsResponse);
   rpc AllPatternScopes (AllPatternScopesRequest) returns (QueryResult_IEnumerable_PatternScopeResponse);
   rpc MatchingPatterns (MatchingPatternsRequest) returns (QueryResult_IEnumerable_BehaviorPatternDetailsResponse);
   rpc PatternsForScope (PatternsForScopeRequest) returns (QueryResult_IEnumerable_BehaviorPatternDetailsResponse);
   rpc UsualActions (UsualActionsRequest) returns (QueryResult_IEnumerable_BehaviorPatternDetailsResponse);
}
