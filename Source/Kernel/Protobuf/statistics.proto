syntax = "proto3";
package Cratis.Chronicle.Contracts.Statistics;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message EventStatisticsResponse {
   int64 TotalEvents = 1;
   int32 EventTypes = 2;
   int32 Namespaces = 3;
   repeated EventTypeCount PerEventType = 4;
}
message EventTypeCount {
   string EventType = 1;
   int64 Count = 2;
}
message QueryResult_EventStatisticsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   EventStatisticsResponse Data = 6;
}
message StatisticsForEventStoreRequest {
   string EventStore = 1;
}
message StatisticsForNamespaceRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Statistics {
   rpc StatisticsForEventStore (StatisticsForEventStoreRequest) returns (QueryResult_EventStatisticsResponse);
   rpc StatisticsForNamespace (StatisticsForNamespaceRequest) returns (QueryResult_EventStatisticsResponse);
}
