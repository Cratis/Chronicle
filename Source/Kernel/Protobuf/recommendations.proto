syntax = "proto3";
package Cratis.Chronicle.Contracts.Recommendations;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllRecommendationsRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message GetRecommendationsRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message IgnoreRecommendationRequest {
   string EventStore = 1;
   string Namespace = 2;
   .bcl.Guid RecommendationId = 3; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message PerformRecommendationRequest {
   string EventStore = 1;
   string Namespace = 2;
   .bcl.Guid RecommendationId = 3; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message QueryResult_IEnumerable_RecommendationDetailsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated RecommendationDetailsResponse Data = 6;
}
message RecommendationDetailsResponse {
   .bcl.Guid Id = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string Name = 2;
   string Description = 3;
   string Type = 4;
   SerializableDateTimeOffset Occurred = 5;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Recommendations {
   rpc AllRecommendations (AllRecommendationsRequest) returns (stream QueryResult_IEnumerable_RecommendationDetailsResponse);
   rpc GetRecommendations (GetRecommendationsRequest) returns (QueryResult_IEnumerable_RecommendationDetailsResponse);
   rpc IgnoreRecommendation (IgnoreRecommendationRequest) returns (CommandResult);
   rpc PerformRecommendation (PerformRecommendationRequest) returns (CommandResult);
}
