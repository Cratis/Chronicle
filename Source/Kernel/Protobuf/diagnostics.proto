syntax = "proto3";
package Cratis.Chronicle.Contracts.Diagnostics;
import "google/protobuf/empty.proto";
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message BusiestGrain {
   string GrainType = 1;
   string EventStore = 2;
   int32 Running = 3;
   int32 Pending = 4;
   double OldestPendingAgeSeconds = 5;
}
message KernelBusinessResponse {
   string Silo = 1;
   KernelLoadStatus Status = 2;
   repeated string Reasons = 3;
   repeated BusiestGrain BusiestGrains = 4;
   int32 OpenStreams = 5;
   repeated RunningJobCount RunningJobs = 6;
}
enum KernelLoadStatus {
   Accepting = 0;
   Degraded = 1;
   Recovering = 2;
}
message QueryResult_KernelBusinessResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   KernelBusinessResponse Data = 6;
}
message RunningJobCount {
   string EventStore = 1;
   string Namespace = 2;
   string JobType = 3;
   int32 Count = 4;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Diagnostics {
   rpc GetKernelBusiness (.google.protobuf.Empty) returns (QueryResult_KernelBusinessResponse);
}
