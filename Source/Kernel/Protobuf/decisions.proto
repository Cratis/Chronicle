syntax = "proto3";
package Cratis.Chronicle.Contracts.Decisions;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message DecisionReadModelResponse {
   string Instance = 1;
   uint64 SequenceNumber = 2;
   repeated string EventTypes = 3;
   DecisionReadRefusal Refusal = 4;
}
enum DecisionReadRefusal {
   None = 0;
   UnknownDefinition = 1;
   Reducer = 2;
   Join = 3;
   NotEventSourceKeyed = 4;
   Hierarchy = 5;
   OpenEndedEventTypes = 6;
   UnspecifiedKey = 7;
   NotEventLog = 8;
   DefinitionChanged = 9;
}
message GetInstanceForDecisionRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ReadModelIdentifier = 3;
   string Key = 4;
}
message QueryResult_DecisionReadModelResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   DecisionReadModelResponse Data = 6;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service DecisionReadModels {
   rpc GetInstanceForDecision (GetInstanceForDecisionRequest) returns (QueryResult_DecisionReadModelResponse);
}
