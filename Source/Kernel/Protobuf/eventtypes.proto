syntax = "proto3";
package Cratis.Chronicle.Contracts.EventTypes;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllEventTypeGenerationsRequest {
   string EventStore = 1;
   string EventTypeId = 2;
}
message AllEventTypesRequest {
   string EventStore = 1;
}
message CheckEventTypeRegistrationsRequest {
   string EventStore = 1;
   repeated EventTypeRegistration Types = 2;
}
message CheckEventTypeRegistrationsResponse {
   repeated EventTypeCheckResult Results = 1;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message CommandResult_CheckEventTypeRegistrationsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   CheckEventTypeRegistrationsResponse Response = 7;
}
message CommandResult_NormalizeEventTypeSchemasResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   NormalizeEventTypeSchemasResponse Response = 7;
}
message CreateEventTypeRequest {
   string EventStore = 1;
   string Name = 2;
}
message EventType {
   string Id = 1;
   uint32 Generation = 2;
   bool Tombstone = 3;
}
message EventTypeCheckResult {
   string EventType = 1;
   uint32 Generation = 2;
   bool Accepted = 3;
   string Reason = 4;
   string Keyword = 5;
   string Path = 6;
}
message EventTypeDetailsResponse {
   EventType Type = 1;
   EventTypeOwner Owner = 2;
   EventTypeSource Source = 3;
   string Schema = 4;
   string Id = 5;
}
message EventTypeGenerationDefinition {
   uint32 Generation = 1;
   string Schema = 2;
}
message EventTypeMigrationDefinition {
   uint32 FromGeneration = 1;
   uint32 ToGeneration = 2;
   repeated EventTypeMigrationOperation Operations = 3;
   string UpcastJmesPath = 4;
   string DowncastJmesPath = 5;
}
message EventTypeMigrationOperation {
   string Operation = 1;
   string Details = 2;
}
enum EventTypeOwner {
   None = 0;
   Client = 1;
   Server = 2;
}
message EventTypeRegistration {
   EventType Type = 1;
   string Schema = 2;
   repeated EventTypeGenerationDefinition Generations = 3;
   repeated EventTypeMigrationDefinition Migrations = 4;
   string EventStore = 5;
   EventTypeVisibility Visibility = 6;
}
enum EventTypeSource {
   EVENT_TYPE_SOURCE_Unknown = 0;
   Code = 1;
   User = 2;
}
enum EventTypeVisibility {
   Unspecified = 0;
   Private = 1;
   Public = 2;
}
message EventTypesWithAnnotationsResponse {
   string EventTypeId = 1;
   uint32 Generation = 2;
   repeated string Keywords = 3;
}
message GetEventTypesWithAnnotationsRequest {
   string EventStore = 1;
}
message NormalizeEventTypeSchemasRequest {
   string EventStore = 1;
   repeated string EventTypeIds = 2;
}
message NormalizeEventTypeSchemasResponse {
   repeated EventTypesWithAnnotationsResponse Changed = 1;
}
message ObserveEventTypesRequest {
   string EventStore = 1;
}
message QueryResult_IEnumerable_EventTypeDetailsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated EventTypeDetailsResponse Data = 6;
}
message QueryResult_IEnumerable_EventTypesWithAnnotationsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated EventTypesWithAnnotationsResponse Data = 6;
}
message RegisterEventTypesRequest {
   string EventStore = 1;
   repeated EventTypeRegistration Types = 2;
   bool DisableValidation = 3;
}
message RegisterSingleEventTypeRequest {
   string EventStore = 1;
   EventTypeRegistration Type = 2;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   VALIDATION_RESULT_SEVERITY_Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service EventTypes {
   rpc AllEventTypeGenerations (AllEventTypeGenerationsRequest) returns (QueryResult_IEnumerable_EventTypeDetailsResponse);
   rpc AllEventTypes (AllEventTypesRequest) returns (QueryResult_IEnumerable_EventTypeDetailsResponse);
   rpc CheckEventTypeRegistrations (CheckEventTypeRegistrationsRequest) returns (CommandResult_CheckEventTypeRegistrationsResponse);
   rpc CreateEventType (CreateEventTypeRequest) returns (CommandResult);
   rpc GetEventTypesWithAnnotations (GetEventTypesWithAnnotationsRequest) returns (QueryResult_IEnumerable_EventTypesWithAnnotationsResponse);
   rpc NormalizeEventTypeSchemas (NormalizeEventTypeSchemasRequest) returns (CommandResult_NormalizeEventTypeSchemasResponse);
   rpc ObserveEventTypes (ObserveEventTypesRequest) returns (stream QueryResult_IEnumerable_EventTypeDetailsResponse);
   rpc RegisterEventTypes (RegisterEventTypesRequest) returns (CommandResult);
   rpc RegisterSingleEventType (RegisterSingleEventTypeRequest) returns (CommandResult);
}
