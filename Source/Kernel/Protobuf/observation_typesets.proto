syntax = "proto3";
package Cratis.Chronicle.Contracts.Observation.TypeSets;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message CommandResult_CompleteDefinitionChangeResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   CompleteDefinitionChangeResponse Response = 7;
}
message CommandResult_InitializeObserversResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   InitializeObserversResponse Response = 7;
}
message CommandResult_RetireEventTypeFromObserverResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
   RetireEventTypeFromObserverResponse Response = 7;
}
message CompleteDefinitionChangeRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ObserverId = 3;
   string EventSequenceId = 4;
   string Reason = 5;
}
message CompleteDefinitionChangeResponse {
   ObserverTypeSetOperationOutcome Outcome = 1;
   .bcl.Guid OperationId = 2; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message GetByOperationRequest {
   string EventStore = 1;
   .bcl.Guid OperationId = 2; // default value could not be applied: 00000000-0000-0000-0000-000000000000
}
message GetForObserverRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ObserverId = 3;
}
message InitializeObserversRequest {
   string EventStore = 1;
   bool StopJobs = 2;
   bool AcceptDuplicates = 3;
}
message InitializeObserversResponse {
   ObserverTypeSetOperationOutcome Outcome = 1;
   repeated ObserverInitializationResult Observers = 2;
   repeated string Reasons = 3;
}
message ObserverDeclaredEventType {
   string Id = 1;
   uint32 Generation = 2;
   bool Tombstone = 3;
}
enum ObserverEventTypeRetirementOutcome {
   NotMember = 0;
   OBSERVER_EVENT_TYPE_RETIREMENT_OUTCOME_Refused = 1;
   Retired = 2;
}
message ObserverEventTypeRetirementRequest {
   .bcl.Guid OperationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string EventTypeId = 2;
}
message ObserverEventTypeRetirementResponse {
   .bcl.Guid OperationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   string EventTypeId = 2;
   ObserverEventTypeRetirementOutcome Outcome = 3;
   ObserverTypeSetIncarnation Incarnation = 4;
   repeated string DeclaringConnections = 5;
}
message ObserverInitializationResult {
   string Namespace = 1;
   string ObserverId = 2;
   ObserverInitializationState State = 3;
   repeated string RefusalReasons = 4;
}
enum ObserverInitializationState {
   OBSERVER_INITIALIZATION_STATE_NotInitialized = 0;
   AwaitingRegistration = 1;
   Initializing = 2;
   Initialized = 3;
}
message ObserverTypeSetChange {
   int64 Revision = 1;
   SerializableDateTimeOffset Started = 2;
   uint64 InitialTail = 3;
   repeated string Additions = 4;
   repeated ObserverEventTypeRetirementRequest Retirements = 5;
}
message ObserverTypeSetFence {
   uint64 Value = 1;
}
message ObserverTypeSetIncarnation {
   int64 Value = 1;
}
message ObserverTypeSetMember {
   string EventTypeId = 1;
   int64 Incarnation = 2;
   ObserverTypeSetFence JoinFence = 3;
}
enum ObserverTypeSetOperationOutcome {
   OBSERVER_TYPE_SET_OPERATION_OUTCOME_NotInitialized = 0;
   Pending = 1;
   Completed = 2;
   OBSERVER_TYPE_SET_OPERATION_OUTCOME_Refused = 3;
   Unavailable = 4;
   NotAvailable = 5;
}
message ObserverTypeSetRegistration {
   string ConnectionId = 1;
   .bcl.Guid RegistrationId = 2;
   repeated ObserverDeclaredEventType DeclaredTypes = 3;
}
message ObserverTypeSetResponse {
   int64 Revision = 1;
   repeated ObserverTypeSetMember Members = 2;
   repeated ObserverTypeSetRegistration Registrations = 3;
   ObserverTypeSetChange PendingChange = 4;
   repeated ObserverEventTypeRetirementResponse RetirementResults = 5;
   ObserverInitializationState InitializationState = 6;
   repeated string RefusalReasons = 7;
}
message QueryResult_IEnumerable_ObserverEventTypeRetirementResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated ObserverEventTypeRetirementResponse Data = 6;
}
message QueryResult_ObserverTypeSetResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2;
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   ObserverTypeSetResponse Data = 6;
}
message RetireEventTypeFromObserverRequest {
   string EventStore = 1;
   string Namespace = 2;
   string ObserverId = 3;
   string EventSequenceId = 4;
   string EventTypeId = 5;
}
message RetireEventTypeFromObserverResponse {
   .bcl.Guid OperationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   ObserverTypeSetOperationOutcome Outcome = 2;
}
// Represents a DateTimeOffset value as an ISO 8601 string (e.g., "2024-01-15T12:30:00.0000000+02:00").
message SerializableDateTimeOffset {
   string Value = 1;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service ObserverTypeSets {
   rpc CompleteDefinitionChange (CompleteDefinitionChangeRequest) returns (CommandResult_CompleteDefinitionChangeResponse);
   rpc GetByOperation (GetByOperationRequest) returns (QueryResult_IEnumerable_ObserverEventTypeRetirementResponse);
   rpc GetForObserver (GetForObserverRequest) returns (QueryResult_ObserverTypeSetResponse);
   rpc InitializeObservers (InitializeObserversRequest) returns (CommandResult_InitializeObserversResponse);
   rpc RetireEventTypeFromObserver (RetireEventTypeFromObserverRequest) returns (CommandResult_RetireEventTypeFromObserverResponse);
}
