syntax = "proto3";
package Cratis.Chronicle.Contracts.Identities;
import "protobuf-net/bcl.proto"; // schema for protobuf-net's handling of core .NET types

message AllIdentitiesRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message CommandResult {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   string AuthorizationFailureReason = 6;
}
message GetIdentitiesRequest {
   string EventStore = 1;
   string Namespace = 2;
}
message Identity {
   string Subject = 1;
   string Name = 2;
   string UserName = 3;
   Identity OnBehalfOf = 4;
}
message IdentityDetailsResponse {
   string Subject = 1;
   string Name = 2;
   string UserName = 3;
   Identity OnBehalfOf = 4;
}
message QueryResult_IEnumerable_IdentityDetailsResponse {
   .bcl.Guid CorrelationId = 1; // default value could not be applied: 00000000-0000-0000-0000-000000000000
   bool IsAuthorized = 2; // default value could not be applied: True
   repeated ValidationResult ValidationResults = 3;
   repeated string ExceptionMessages = 4;
   string ExceptionStackTrace = 5;
   repeated IdentityDetailsResponse Data = 6;
}
message RenameIdentityRequest {
   string EventStore = 1;
   string Namespace = 2;
   string Subject = 3;
   string Name = 4;
}
message ValidationResult {
   ValidationResultSeverity Severity = 1; // default value could not be applied: Error
   string Message = 2;
   repeated string Members = 3;
}
enum ValidationResultSeverity {
   Unknown = 0;
   Information = 1;
   Warning = 2;
   Error = 3;
}
service Identities {
   rpc AllIdentities (AllIdentitiesRequest) returns (stream QueryResult_IEnumerable_IdentityDetailsResponse);
   rpc GetIdentities (GetIdentitiesRequest) returns (QueryResult_IEnumerable_IdentityDetailsResponse);
   rpc RenameIdentity (RenameIdentityRequest) returns (CommandResult);
}
