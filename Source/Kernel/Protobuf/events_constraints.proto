syntax = "proto3";
package Cratis.Chronicle.Contracts.Events.Constraints;
import "google/protobuf/empty.proto";

message ClosesStreamConstraintDefinition {
   repeated string EventTypeIds = 1;
   uint32 Dimensions = 2;
   repeated string ReopenedBy = 3;
   string EventStreamIdFrom = 4;
}
message Constraint {
   string Name = 1;
   ConstraintType Type = 2;
   repeated string RemovedWith = 3;
   OneOf_UniqueConstraintDefinition_UniqueEventTypeConstraintDefinition Definition = 4;
   ConstraintScope Scope = 5;
   repeated string EventSequences = 6;
   ClosesStreamConstraintDefinition ClosesStream = 7;
}
message ConstraintScope {
   string EventSourceType = 1;
   string EventStreamType = 2;
   string EventStreamId = 3;
}
enum ConstraintType {
   Unknown = 0;
   Unique = 1;
   UniqueEventType = 2;
   Schema = 3;
   StreamClosed = 4;
   ClosesStream = 5;
}
message OneOf_UniqueConstraintDefinition_UniqueEventTypeConstraintDefinition {
   UniqueConstraintDefinition Value0 = 1;
   UniqueEventTypeConstraintDefinition Value1 = 2;
}
message RegisterConstraintsRequest {
   string EventStore = 1;
   repeated Constraint Constraints = 2;
}
message UniqueConstraintDefinition {
   repeated UniqueConstraintEventDefinition EventDefinitions = 1;
   bool IgnoreCasing = 2;
   UniqueConstraintMode Mode = 3;
   repeated UniqueConstraintEventDefinition RemovalEventDefinitions = 4;
}
message UniqueConstraintEventDefinition {
   string EventTypeId = 1;
   repeated string Properties = 2;
}
enum UniqueConstraintMode {
   PerEventSource = 0;
   PerValue = 1;
}
message UniqueEventTypeConstraintDefinition {
   reserved 1;
   repeated string EventTypeIds = 2;
}
service Constraints {
   rpc Register (RegisterConstraintsRequest) returns (.google.protobuf.Empty);
}
