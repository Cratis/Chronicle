checksumBehavior: update

nodeLinker: node-modules

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"
  "@cratis/components@*":
    peerDependencies:
      "@cratis/arc": "*"
      "@cratis/arc.react": "*"

# npmMinimalAgeGate quarantines versions published within the last 24 hours. Cratis packages are
# first-party and published continuously, so waiting out the cooldown is never meaningful for them.
# The vite entries opt specific third-party packages out of that protection - drop them once the
# pinned versions age past the gate.
npmPreapprovedPackages:
  - "@cratis/*"
  - "vite"
  - "@vitejs/plugin-react"

pnpMode: loose

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: false

yarnPath: .yarn/releases/yarn-4.17.1.cjs
