checksumBehavior: update

nodeLinker: node-modules

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"

# The 24h publish-cooldown gate is off, matching Studio - Cratis packages release continuously
# and the repos always move forward, so the cooldown only ever blocked upgrades.
npmMinimalAgeGate: 0

pnpMode: loose

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: false

yarnPath: .yarn/releases/yarn-4.17.1.cjs
