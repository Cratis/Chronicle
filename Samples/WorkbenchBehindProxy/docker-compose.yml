# Two Chronicle instances on one host, each with its Workbench under its own path:
#
#   http://localhost:8080/alpha/chronicle/   - the proxy passes the prefix through
#   http://localhost:8080/beta/chronicle/    - the proxy strips the prefix first
#
# Both work because the kernel accepts requests with or without the prefix.
services:
  proxy:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8080
      # The kernel presents a self-signed certificate on its one port. Only for this local sample.
      - --serversTransport.insecureSkipVerify=true
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alpha:
    image: cratis/chronicle:latest-development
    environment:
      # The path the browser uses. The proxy leaves it on the request.
      - Cratis__Chronicle__Workbench__BasePath=/alpha/chronicle
    labels:
      - traefik.enable=true
      - traefik.http.routers.alpha.rule=PathPrefix(`/alpha/chronicle`)
      - traefik.http.routers.alpha.entrypoints=web
      - traefik.http.services.alpha.loadbalancer.server.port=35000
      - traefik.http.services.alpha.loadbalancer.server.scheme=https

  beta:
    image: cratis/chronicle:latest-development
    environment:
      # Same setting. The proxy removes the prefix, and the kernel still writes it into the page.
      - Cratis__Chronicle__Workbench__BasePath=/beta/chronicle
    labels:
      - traefik.enable=true
      - traefik.http.routers.beta.rule=PathPrefix(`/beta/chronicle`)
      - traefik.http.routers.beta.entrypoints=web
      - traefik.http.routers.beta.middlewares=beta-strip
      - traefik.http.middlewares.beta-strip.stripprefix.prefixes=/beta/chronicle
      - traefik.http.services.beta.loadbalancer.server.port=35000
      - traefik.http.services.beta.loadbalancer.server.scheme=https
